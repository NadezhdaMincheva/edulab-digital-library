<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БДП – Игра на паметта 🚦</title>
<style>
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; min-height:100vh;
    font-family:'Comic Sans MS','Trebuchet MS',sans-serif;
    background:linear-gradient(135deg,#74ebd5,#9face6);
    display:flex; align-items:flex-start; justify-content:center;
    padding:16px;
  }
  #app{width:100%; max-width:720px;}

  .panel{
    background:rgba(255,255,255,0.95);
    border-radius:28px; padding:24px 20px;
    box-shadow:0 20px 50px rgba(0,0,0,0.18);
  }
  h1{
    text-align:center; margin:0 0 4px;
    font-size:clamp(22px,5vw,34px); color:#2d3436;
  }
  .subtitle{text-align:center; color:#636e72; margin-bottom:20px; font-size:14px;}

  /* STAT BAR */
  .stat-bar{display:flex; gap:10px; justify-content:center; margin-bottom:18px; flex-wrap:wrap;}
  .stat{
    background:#f1f2f6; border-radius:14px; padding:8px 18px;
    font-weight:bold; font-size:15px; text-align:center; min-width:90px;
  }
  .stat span.lbl{display:block; font-size:11px; color:#636e72; margin-bottom:2px;}
  .stat span.val{font-size:20px; color:#6c5ce7;}

  /* NAV */
  .nav-row{display:flex; justify-content:space-between; margin-bottom:14px;}
  .nav-btn{
    border:none; background:#dfe6e9; color:#2d3436;
    padding:9px 16px; border-radius:12px; font-weight:bold;
    cursor:pointer; font-family:inherit; font-size:13px;
    box-shadow:0 4px 0 #b2bec3;
  }
  .nav-btn:active{transform:translateY(2px); box-shadow:0 2px 0 #b2bec3;}

  /* BOARD */
  .board{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:12px; max-width:540px; margin:0 auto;
  }

  .card{perspective:900px; cursor:pointer; aspect-ratio:1/1;}
  .card-inner{
    position:relative; width:100%; height:100%;
    transition:transform .45s; transform-style:preserve-3d;
  }
  .card.flipped .card-inner{transform:rotateY(180deg);}
  .card.matched .card-inner{animation:pop .5s ease forwards; transform:rotateY(180deg);}
  @keyframes pop{
    0%{transform:rotateY(180deg) scale(1);}
    50%{transform:rotateY(180deg) scale(1.18);}
    100%{transform:rotateY(180deg) scale(1);}
  }

  .card-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:18px; display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    box-shadow:0 5px 14px rgba(0,0,0,0.15);
  }
  .card-back{
    background:linear-gradient(135deg,#6c5ce7,#a29bfe);
    font-size:clamp(24px,7vw,44px); color:#fff;
  }
  .card-front{
    background:#fff; transform:rotateY(180deg);
    font-size:clamp(24px,8vw,52px);
    padding:4px;
  }
  .card-front .lbl{
    font-size:clamp(9px,1.8vw,13px); font-weight:bold;
    color:#2d3436; text-align:center; line-height:1.2;
    padding:0 4px 4px;
  }
  .card.matched .card-front{
    background:#eafff1;
    box-shadow:0 0 0 3px #2ecc71 inset, 0 5px 14px rgba(0,0,0,0.1);
  }

  /* WIN */
  .overlay{
    position:fixed; inset:0; background:rgba(45,52,54,0.55);
    display:flex; align-items:center; justify-content:center; z-index:60;
    padding:16px;
  }
  .win-box{
    background:#fff; border-radius:28px; padding:28px 24px;
    max-width:360px; width:100%; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.35); position:relative; overflow:hidden;
  }
  .win-box h2{font-size:26px; color:#e84393; margin:6px 0;}
  .win-stats{display:flex; justify-content:center; gap:16px; margin:14px 0;}
  .win-stats div{background:#f8f8ff; border-radius:14px; padding:10px 14px;}
  .win-stats .v{display:block; font-size:22px; font-weight:bold; color:#6c5ce7;}
  .win-stats .l{font-size:11px; color:#636e72;}
  .win-actions{display:flex; gap:10px; justify-content:center; margin-top:10px; flex-wrap:wrap;}
  .primary-btn{
    background:linear-gradient(145deg,#6c5ce7,#a29bfe); color:#fff;
    border:none; padding:11px 20px; border-radius:14px;
    font-weight:bold; cursor:pointer; font-family:inherit; font-size:14px;
    box-shadow:0 5px 0 #4834d4;
  }
  .primary-btn:active{transform:translateY(2px); box-shadow:0 3px 0 #4834d4;}

  .confetti{position:absolute; top:-20px; width:10px; height:16px; animation:fall linear forwards;}
  @keyframes fall{to{transform:translateY(540px) rotate(360deg); opacity:0;}}

  .hint{text-align:center; font-size:12px; color:#b2bec3; margin-top:10px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ---- 6 ДВОЙКИ: БДП за деца 5 г. ---- */
const PAIRS = [
  { emoji:'🚦', label:'Светофар' },
  { emoji:'🚸', label:'Пешеходна\nпътека' },
  { emoji:'🛑', label:'СТОП' },
  { emoji:'👮', label:'Полицай' },
  { emoji:'🚲', label:'Велосипед' },
  { emoji:'🦺', label:'Светлоотразителна\nжилетка' },
];

let cards=[], firstIdx=null, secondIdx=null, lock=false;
let moves=0, matches=0, seconds=0, timer=null, finished=false;

function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=0|Math.random()*(i+1);[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function fmt(s){return String(0|s/60).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}

function startGame(){
  const doubled = shuffle([...PAIRS,...PAIRS]);
  cards = doubled.map((p,i)=>({uid:i,pair:p,flipped:false,matched:false}));
  firstIdx=null; secondIdx=null; lock=false;
  moves=0; matches=0; seconds=0; finished=false;
  if(timer){clearInterval(timer); timer=null;}
  render();
}

function render(){
  document.getElementById('app').innerHTML=`
    <div class="panel">
      <h1>🚦 Безопасност на пътя</h1>
      <div class="subtitle">Намери двойките и научи правилата на пътя! 🎉</div>
      <div class="stat-bar">
        <div class="stat"><span class="lbl">ВРЕМЕ</span><span class="val" id="tv">${fmt(seconds)}</span></div>
        <div class="stat"><span class="lbl">ОПИТИ</span><span class="val" id="mv">${moves}</span></div>
        <div class="stat"><span class="lbl">ДВОЙКИ</span><span class="val" id="pt">${matches}/6</span></div>
      </div>
      <div class="nav-row">
        <button class="nav-btn" data-action="restart">🔄 Отначало</button>
      </div>
      <div class="board" id="board">
        ${cards.map(c=>`
          <div class="card ${c.flipped||c.matched?'flipped':''} ${c.matched?'matched':''}" data-action="flip" data-uid="${c.uid}">
            <div class="card-inner">
              <div class="card-face card-back">🚗</div>
              <div class="card-face card-front">
                <span>${c.pair.emoji}</span>
                <span class="lbl">${c.pair.label}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="hint">Обърни по две карти – намери еднаквите двойки 😊</div>
    </div>`;
}

function updateStats(){
  const t=document.getElementById('tv');
  const m=document.getElementById('mv');
  const p=document.getElementById('pt');
  if(t) t.textContent=fmt(seconds);
  if(m) m.textContent=moves;
  if(p) p.textContent=matches+'/6';
}

function flipCard(uid){
  if(lock||finished) return;
  const card=cards.find(c=>c.uid===uid);
  if(!card||card.flipped||card.matched) return;
  if(!timer) timer=setInterval(()=>{seconds++; updateStats();},1000);
  card.flipped=true;
  document.querySelector(`.card[data-uid="${uid}"]`)?.classList.add('flipped');

  if(firstIdx===null){ firstIdx=uid; return; }
  secondIdx=uid; lock=true; moves++;
  updateStats();

  const A=cards.find(c=>c.uid===firstIdx);
  const B=cards.find(c=>c.uid===secondIdx);
  const ok=A.pair.emoji===B.pair.emoji;

  if(ok){
    setTimeout(()=>{
      A.matched=B.matched=true;
      matches++;
      [A,B].forEach(c=>{
        document.querySelector(`.card[data-uid="${c.uid}"]`)?.classList.add('matched');
      });
      updateStats();
      firstIdx=secondIdx=null; lock=false;
      if(matches===6) finish();
    },350);
  } else {
    setTimeout(()=>{
      A.flipped=B.flipped=false;
      [A,B].forEach(c=>{
        document.querySelector(`.card[data-uid="${c.uid}"]`)?.classList.remove('flipped');
      });
      firstIdx=secondIdx=null; lock=false;
    },900);
  }
}

function finish(){
  finished=true;
  if(timer){clearInterval(timer); timer=null;}
  const colors=['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e84393'];
  let conf='';
  for(let i=0;i<60;i++){
    const l=Math.random()*100, dl=Math.random()*.6, du=1.8+Math.random()*1.4;
    conf+=`<div class="confetti" style="left:${l}%;background:${colors[i%6]};animation-delay:${dl}s;animation-duration:${du}s;"></div>`;
  }
  const ov=document.createElement('div');
  ov.className='overlay';
  ov.innerHTML=`
    <div class="win-box">
      ${conf}
      <div style="font-size:48px;">🎉🏆🎉</div>
      <h2>Браво! Спечели!</h2>
      <div style="color:#2d3436;font-size:15px;margin-bottom:4px;">Ти знаеш правилата на пътя! 🚦</div>
      <div class="win-stats">
        <div><span class="v">${fmt(seconds)}</span><span class="l">ВРЕМЕ</span></div>
        <div><span class="v">${moves}</span><span class="l">ОПИТИ</span></div>
        <div><span class="v">6/6</span><span class="l">ДВОЙКИ</span></div>
      </div>
      <div class="win-actions">
        <button class="primary-btn" data-action="restart">🔄 Играй пак</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
}

document.addEventListener('click',e=>{
  const btn=e.target.closest('[data-action]');
  if(!btn) return;
  if(btn.getAttribute('data-action')==='restart'){
    document.querySelectorAll('.overlay').forEach(o=>o.remove());
    startGame();
  }
  if(btn.getAttribute('data-action')==='flip'){
    flipCard(parseInt(btn.getAttribute('data-uid')));
  }
});

startGame();
</script>
</body>
</html>
