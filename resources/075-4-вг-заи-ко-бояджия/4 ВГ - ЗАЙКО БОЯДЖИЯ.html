<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Зайко Бояджия - Боядисай 10 Яйца!</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #e0f7fa; text-align: center; margin: 0; padding: 10px; }
        #game-container { background: white; border-radius: 30px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); display: inline-block; width: 95%; max-width: 900px; border: 6px solid #4caf50; }
        h1 { color: #2e7d32; font-size: 32px; margin: 10px 0; }
        
        /* Четки и Палитра */
        .palette { background: #fffde7; border-radius: 20px; padding: 15px; margin-bottom: 20px; display: flex; justify-content: center; gap: 15px; border: 3px solid #fbc02d; align-items: center; }
        .paint-pot { width: 60px; height: 60px; border-radius: 50%; cursor: pointer; border: 4px solid white; box-shadow: 0 4px 8px rgba(0,0,0,0.2); transition: 0.2s; position: relative; }
        .paint-pot:hover { transform: scale(1.1); }
        .paint-pot.selected { border-color: #333; transform: scale(1.15); box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        
        /* Заекът и четката */
        #bunny-area { font-size: 80px; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        #brush { font-size: 50px; transition: color 0.3s; color: #ccc; /* Сив, когато няма боя */ }

        /* Яйцата */
        .eggs-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding: 10px; }
        .egg-wrapper { display: flex; flex-direction: column; align-items: center; }
        .egg { width: 60px; height: 85px; background: white; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; cursor: pointer; border: 3px solid #ccc; box-shadow: inset 4px 4px 10px rgba(0,0,0,0.05); transition: 0.3s; }
        .egg:hover { transform: scale(1.05); }
        .egg.colored { border-color: rgba(0,0,0,0.1); box-shadow: 4px 4px 8px rgba(0,0,0,0.1); }
        
        /* Номерца под яйцата */
        .egg-number { font-size: 18px; font-weight: bold; color: #555; margin-top: 5px; background: #eee; padding: 2px 8px; border-radius: 10px; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🎨 Зайко Бояджия 🖌️</h1>
    
    <div id="bunny-area">
        <span>🐰</span>
        <span id="brush">🖌️</span> </div>

    <div class="palette" id="palette">
        <div class="paint-pot" style="background-color: #f44336;" data-color="#f44336"></div>
        <div class="paint-pot" style="background-color: #2196f3;" data-color="#2196f3"></div>
        <div class="paint-pot" style="background-color: #4caf50;" data-color="#4caf50"></div>
        <div class="paint-pot" style="background-color: #ffeb3b;" data-color="#ffeb3b"></div>
        <div class="paint-pot" style="background-color: #ff9800;" data-color="#ff9800"></div>
        <div class="paint-pot" style="background-color: #9c27b0;" data-color="#9c27b0"></div>
    </div>

    <p style="font-size: 18px; color: #555;">Избери цвят от купичката и докосни яйце, за да го боядисаш!</p>

    <div class="eggs-row" id="eggs-row">
        </div>
</div>

<script>
    let selectedColor = "";
    const brush = document.getElementById('brush');
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    // Звук при боядисване (кратко "шлюп")
    function playBoiadisvaneSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(400, audioCtx.currentTime);
        osc.frequency.rampToValueAtTime(100, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // Звук при потапяне на четката (кратко "пук")
    function playPotapianeSound() {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    // Генериране на палитрата
    const pots = document.querySelectorAll('.paint-pot');
    pots.forEach(pot => {
        pot.onclick = () => {
            // Премахваме маркировката от предишния цвят
            pots.forEach(p => p.classList.remove('selected'));
            // Маркираме новия цвят
            pot.classList.add('selected');
            selectedColor = pot.getAttribute('data-color');
            // Оцветяваме четката
            brush.style.color = selectedColor;
            playPotapianeSound();
        };
    });

    // Генериране на 10-те яйца
    const row = document.getElementById('eggs-row');
    for (let i = 1; i <= 10; i++) {
        // Wrapper, за да има яйце и номер едно под друго
        const wrapper = document.createElement('div');
        wrapper.className = 'egg-wrapper';

        // Самото бяло яйце
        const egg = document.createElement('div');
        egg.className = 'egg';
        egg.onclick = () => {
            if (selectedColor !== "") {
                egg.style.backgroundColor = selectedColor;
                egg.classList.add('colored');
                playBoiadisvaneSound();
            } else {
                alert("Първо избери цвят от палитрата, за да потопиш четката!");
            }
        };

        // Номерът под яйцето
        const num = document.createElement('div');
        num.className = 'egg-number';
        num.innerText = i;

        wrapper.appendChild(egg);
        wrapper.appendChild(num);
        row.appendChild(wrapper);
    }
</script>

</body>
</html>
