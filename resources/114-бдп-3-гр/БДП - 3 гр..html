<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Игра за Безопасност на Движението</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', 'Comic Neue', cursive;
            overflow-x: hidden;
        }

        .game-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #FFD93D 0%, #6BCF7F 50%, #4D96FF 100%);
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .completion-container {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        .cloud {
            position: absolute;
            font-size: 60px;
            opacity: 0.6;
            animation: floatCloud 20s linear infinite;
        }

        .cloud-2 {
            top: 150px;
            right: 10%;
            font-size: 80px;
            opacity: 0.5;
            animation: floatCloud 25s linear infinite;
        }

        .star-fall {
            position: absolute;
            font-size: 40px;
            animation: fall 2s ease-in forwards;
            pointer-events: none;
        }

        .score-panel {
            max-width: 900px;
            margin: 0 auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .score-box {
            background: white;
            border-radius: 20px;
            padding: 15px 30px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            font-size: 24px;
            font-weight: bold;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-card {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
            animation: slideIn 0.5s ease-out;
        }

        .question-illustration {
            text-align: center;
            margin-bottom: 30px;
            animation: bounce 2s ease-in-out infinite;
        }

        .question-illustration svg {
            max-width: 100%;
            height: auto;
        }

        .question-text {
            font-size: 36px;
            color: #333;
            text-align: center;
            margin-bottom: 40px;
            font-weight: bold;
            line-height: 1.4;
        }

        .options-container {
            display: grid;
            gap: 20px;
            margin-bottom: 30px;
        }

        .option-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 20px;
            padding: 25px 30px;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Comic Sans MS', cursive;
        }

        .option-button:hover:not(:disabled) {
            transform: scale(1.03) translateY(-3px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }

        .option-button:disabled {
            cursor: not-allowed;
        }

        .option-button.correct {
            background: linear-gradient(135deg, #6BCF7F 0%, #4CAF50 100%);
            transform: scale(1.03);
        }

        .option-button.incorrect {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            opacity: 0.6;
        }

        .option-icon {
            font-size: 40px;
        }

        .feedback-box {
            border-radius: 20px;
            padding: 30px;
            margin-top: 30px;
            animation: slideUp 0.4s ease-out;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .feedback-box.correct {
            background: linear-gradient(135deg, #e0f7e9 0%, #b8f3d0 100%);
        }

        .feedback-box.incorrect {
            background: linear-gradient(135deg, #ffe5e5 0%, #ffc9c9 100%);
        }

        .feedback-emoji {
            font-size: 60px;
            text-align: center;
            margin-bottom: 15px;
        }

        .feedback-title {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
        }

        .feedback-title.correct {
            color: #2d7f4e;
        }

        .feedback-title.incorrect {
            color: #d32f2f;
        }

        .feedback-text {
            font-size: 24px;
            color: #555;
            text-align: center;
            line-height: 1.5;
        }

        .completion-card {
            background: white;
            border-radius: 30px;
            padding: 50px 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .trophy {
            font-size: 120px;
            margin-bottom: 20px;
            animation: bounce 1s ease-in-out infinite;
        }

        .completion-title {
            font-size: 48px;
            color: #667eea;
            margin-bottom: 15px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .score-text {
            font-size: 28px;
            color: #555;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .stars-display {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            font-size: 50px;
            flex-wrap: wrap;
        }

        .star {
            display: inline-block;
        }

        .completion-message {
            font-size: 22px;
            color: #764ba2;
            margin-bottom: 30px;
            line-height: 1.5;
            font-weight: 600;
        }

        .restart-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 50px;
            padding: 20px 50px;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: 'Comic Sans MS', cursive;
        }

        .restart-button:hover {
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .bg-circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 6s ease-in-out infinite;
        }

        .bg-circle-1 {
            top: 10%;
            left: 10%;
            width: 100px;
            height: 100px;
        }

        .bg-circle-2 {
            bottom: 15%;
            right: 15%;
            width: 150px;
            height: 150px;
            animation: float 8s ease-in-out infinite;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        @keyframes floatCloud {
            from {
                transform: translateX(-100px);
            }
            to {
                transform: translateX(calc(100vw + 100px));
            }
        }

        @keyframes fall {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        @keyframes scaleIn {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        @keyframes starPop {
            0% {
                transform: scale(0) rotate(0deg);
            }
            50% {
                transform: scale(1.2) rotate(180deg);
            }
            100% {
                transform: scale(1) rotate(360deg);
            }
        }

        @media (max-width: 768px) {
            .question-text {
                font-size: 28px;
            }
            .option-button {
                font-size: 24px;
                padding: 20px 25px;
            }
            .game-card {
                padding: 30px 20px;
            }
        }
    </style>
</head>

                    <line x1="138" y1="73" x2="146" y2="68" stroke="white" stroke-width="3"/>
                    <line x1="162" y1="73" x2="154" y2="68" stroke="white" stroke-width="3"/>
                    <rect x="50" y="140" width="200" height="10" fill="white"/>
                    <rect x="50" y="155" width="200" height="10" fill="white"/>
                    <rect x="50" y="170" width="200" height="10" fill="white"/>
                </svg>`,
                explanation: "Синият знак с човече показва къде е пешеходната пътека!"
            },
            {
                question: "Как трябва да пресичаме улицата?",
                options: [
                    { text: "Бавно и внимателно", correct: true, icon: "🐢" },
                    { text: "Като бягаме", correct: false, icon: "🏃" },
                    { text: "Като скачаме", correct: false, icon: "🦘" }
                ],
                imageSvg: `<svg viewBox="0 0 300 200" style="width: 300px; height: 200px;">
                    <rect x="0" y="0" width="300" height="200" fill="#87ceeb"/>
                    <rect x="0" y="100" width="300" height="100" fill="#555"/>
                    <rect x="100" y="100" width="100" height="15" fill="white"/>
                    <rect x="100" y="125" width="100" height="15" fill="white"/>
                    <rect x="100" y="150" width="100" height="15" fill="white"/>
                    <rect x="100" y="175" width="100" height="15" fill="white"/>
                    <circle cx="130" cy="125" r="12" fill="#ffd1a3"/>
                    <rect x="123" y="137" width="14" height="22" fill="#9b59b6"/>
                    <rect x="120" y="159" width="6" height="16" fill="#2c3e50"/>
                    <rect x="131" y="159" width="6" height="16" fill="#2c3e50"/>
                    <circle cx="125" cy="122" r="2" fill="#333"/>
                    <circle cx="135" cy="122" r="2" fill="#333"/>
                    <path d="M 125 128 Q 130 130 135 128" stroke="#333" stroke-width="2" fill="none"/>
                    <ellipse cx="220" cy="65" rx="20" ry="15" fill="#27ae60"/>
                    <circle cx="220" cy="55" r="8" fill="#2ecc71"/>
                    <circle cx="218" cy="53" r="2" fill="#333"/>
                </svg>`,
                explanation: "Винаги пресичаме бавно и внимателно, за да можем да видим колите!"
            },
            {
                question: "Какво правим ако топката ни падне на улицата?",
                options: [
                    { text: "Казваме на възрастен", correct: true, icon: "👨" },
                    { text: "Тичаме да я вземем", correct: false, icon: "⚽" },
                    { text: "Викаме силно", correct: false, icon: "📢" }
                ],
                imageSvg: `<svg viewBox="0 0 300 200" style="width: 300px; height: 200px;">
                    <rect x="0" y="0" width="300" height="200" fill="#87ceeb"/>
                    <rect x="0" y="130" width="300" height="70" fill="#7f8c8d"/>
                    <rect x="0" y="120" width="300" height="10" fill="#f39c12"/>
                    <circle cx="200" cy="165" r="15" fill="#e74c3c"/>
                    <path d="M 190 165 Q 200 155 210 165" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M 200 155 L 200 175" stroke="white" stroke-width="2"/>
                    <rect x="0" y="0" width="300" height="120" fill="#95a5a6"/>
                    <circle cx="100" cy="85" r="15" fill="#ffd1a3"/>
                    <rect x="92" y="100" width="16" height="25" fill="#3498db"/>
                    <circle cx="95" cy="82" r="2" fill="#333"/>
                    <circle cx="105" cy="82" r="2" fill="#333"/>
                    <path d="M 95 92 Q 100 88 105 92" stroke="#333" stroke-width="2" fill="none"/>
                    <circle cx="130" cy="70" r="12" fill="#ffd1a3"/>
                    <rect x="123" y="82" width="14" height="30" fill="#2c3e50"/>
                    <line x1="115" y1="90" x2="92" y2="105" stroke="#ffd1a3" stroke-width="3"/>
                </svg>`,
                explanation: "НИКОГА не тичаме на улицата! Винаги казваме на мама, тате или друг възрастен!"
            }
        ];

        let currentLevel = 0;
        let score = 0;
        let showFeedback = false;
        let feedbackCorrect = false;
        let gameComplete = false;

        function renderGame() {
            const app = document.getElementById('app');
            
            if (gameComplete) {
                app.innerHTML = renderCompletionScreen();
            } else {
                app.innerHTML = renderGameScreen();
            }
        }

        function renderGameScreen() {
            const level = levels[currentLevel];
            
            return `
                <div class="game-container">
                    <div class="cloud" style="top: 50px; left: 5%;">☁️</div>
                    <div class="cloud cloud-2">☁️</div>
                    
                    <div class="score-panel">
                        <div class="score-box">
                            ⭐ Точки: ${score}/${levels.length}
                        </div>
                        <div class="score-box">
                            Въпрос ${currentLevel + 1} от ${levels.length}
                        </div>
                    </div>
                    
                    <div class="game-card">
                        <div class="question-illustration">
                            ${level.imageSvg}
                        </div>
                        
                        <h2 class="question-text">${level.question}</h2>
                        
                        <div class="options-container">
                            ${level.options.map((option, idx) => `
                                <button 
                                    class="option-button ${showFeedback ? (option.correct ? 'correct' : 'incorrect') : ''}" 
                                    onclick="handleAnswer(${option.correct})"
                                    ${showFeedback ? 'disabled' : ''}
                                >
                                    <span class="option-icon">${option.icon}</span>
                                    <span>${option.text}</span>
                                </button>
                            `).join('')}
                        </div>
                        
                        ${showFeedback ? `
                            <div class="feedback-box ${feedbackCorrect ? 'correct' : 'incorrect'}">
                                <div class="feedback-emoji">${feedbackCorrect ? '🎉' : '💪'}</div>
                                <p class="feedback-title ${feedbackCorrect ? 'correct' : 'incorrect'}">
                                    ${feedbackCorrect ? 'БРАВО!' : 'Опитай пак!'}
                                </p>
                                <p class="feedback-text">${level.explanation}</p>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
        }

        function renderCompletionScreen() {
            const getMessage = () => {
                if (score === levels.length) {
                    return "Ти си ШАМПИОН по безопасност! 🚦👑";
                } else if (score >= levels.length * 0.75) {
                    return "Отлично! Знаеш много за безопасността! 🌟";
                } else if (score >= levels.length / 2) {
                    return "Много добре! Учиш се бързо! 😊";
                } else {
                    return "Чудесно начало! Продължавай да учиш! 💪";
                }
            };

            const stars = Array.from({ length: levels.length }).map((_, i) => 
                `<span class="star" style="animation: starPop 0.5s ease-out ${i * 0.1}s both;">${i < score ? '⭐' : '☆'}</span>`
            ).join('');

            return `
                <div class="completion-container">
                    <div class="bg-circle bg-circle-1"></div>
                    <div class="bg-circle bg-circle-2"></div>
                    
                    <div class="completion-card">
                        <div class="trophy">🏆</div>
                        <h1 class="completion-title">БРАВО! 🎉</h1>
                        <p class="score-text">Отговори правилно на ${score} от ${levels.length} въпроса!</p>
                        <div class="stars-display">${stars}</div>
                        <p class="completion-message">${getMessage()}</p>
                        <button class="restart-button" onclick="restartGame()">Играй отново 🔄</button>
                    </div>
                </div>
            `;
        }

        function handleAnswer(correct) {
            if (showFeedback) return;
            
            showFeedback = true;
            feedbackCorrect = correct;
            
            if (correct) {
                score++;
                createStars();
            }
            
            renderGame();
            
            setTimeout(() => {
                showFeedback = false;
                if (currentLevel < levels.length - 1) {
                    currentLevel++;
                } else {
                    gameComplete = true;
                }
                renderGame();
            }, 3000);
        }

        function createStars() {
            const container = document.querySelector('.game-container');
            if (!container) return;
            
            for (let i = 0; i < 15; i++) {
                const star = document.createElement('div');
                star.className = 'star-fall';
                star.textContent = '⭐';
                star.style.left = Math.random() * 100 + '%';
                star.style.animationDelay = Math.random() * 0.5 + 's';
                container.appendChild(star);
                
                setTimeout(() => star.remove(), 2000);
            }
        }

        function restartGame() {
            currentLevel = 0;
            score = 0;
            showFeedback = false;
            feedbackCorrect = false;
            gameComplete = false;
            renderGame();
        }

        // Initialize game
        renderGame();
    </script>
</body>
</html>
