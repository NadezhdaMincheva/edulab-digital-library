<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Игра на паметта 🧠</title>
<style>
  :root{
    --bg1:#ff9a9e; --bg2:#fad0c4; --bg3:#a18cd1; --bg4:#fbc2eb;
    --card-back1:#6c5ce7; --card-back2:#a29bfe;
    --accent:#ff6b6b;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  body{
    margin:0; min-height:100vh; font-family:'Trebuchet MS','Comic Sans MS',sans-serif;
    background:linear-gradient(135deg, var(--bg1), var(--bg2), var(--bg3), var(--bg4));
    background-size:400% 400%;
    animation: bgshift 18s ease infinite;
    display:flex; align-items:flex-start; justify-content:center;
    padding:16px; color:#2d3436;
  }
  @keyframes bgshift{
    0%{background-position:0% 50%;} 50%{background-position:100% 50%;} 100%{background-position:0% 50%;}
  }
  #app{ width:100%; max-width:960px; }

  .panel{
    background:rgba(255,255,255,0.92);
    border-radius:24px;
    padding:24px;
    box-shadow:0 20px 50px rgba(0,0,0,0.2);
    backdrop-filter:blur(4px);
  }
  h1{
    text-align:center; font-size:clamp(26px,5vw,42px); margin:0 0 6px;
    color:#6c5ce7; text-shadow:2px 2px 0 #fff, 4px 4px 8px rgba(0,0,0,0.15);
  }
  .subtitle{ text-align:center; color:#636e72; margin-bottom:20px; font-size:clamp(14px,2.5vw,17px);}

  .grid-select{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(140px,1fr));
    gap:14px; margin-top:10px;
  }
  .opt-btn{
    border:none; border-radius:18px; padding:18px 10px; cursor:pointer;
    font-family:inherit; font-weight:bold; font-size:16px;
    background:linear-gradient(145deg,#ffffff,#f1f2f6);
    box-shadow:0 6px 0 #dcdde1, 0 8px 14px rgba(0,0,0,0.12);
    transition:transform .15s, box-shadow .15s;
    display:flex; flex-direction:column; align-items:center; gap:8px;
    color:#2d3436;
  }
  .opt-btn .icon{font-size:38px;}
  .opt-btn:hover{ transform:translateY(-3px); }
  .opt-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #dcdde1, 0 4px 8px rgba(0,0,0,0.12); }
  .opt-btn.size-card{ background:linear-gradient(145deg,#fff,#f8f8ff); }
  .opt-btn .badge{ font-size:12px; font-weight:600; color:#6c5ce7; background:#eee6ff; padding:4px 10px; border-radius:20px;}
  .opt-btn .pairs{ font-size:13px; color:#636e72; }
  .opt-btn.disabled{ opacity:0.4; cursor:not-allowed; box-shadow:none; }
  .opt-btn.disabled:hover{ transform:none; }
  .opt-btn.recommended{ outline:3px solid #ffeaa7; }

  .back-row{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;}
  .nav-btn{
    border:none; background:#dfe6e9; color:#2d3436; padding:10px 16px; border-radius:14px;
    font-weight:bold; cursor:pointer; font-family:inherit; font-size:14px;
    box-shadow:0 4px 0 #b2bec3;
  }
  .nav-btn:active{ transform:translateY(2px); box-shadow:0 2px 0 #b2bec3; }

  /* Game screen */
  .stat-bar{
    display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-bottom:18px;
  }
  .stat{
    background:#fff; border-radius:16px; padding:10px 18px; box-shadow:0 4px 10px rgba(0,0,0,0.1);
    font-weight:bold; font-size:15px; min-width:90px; text-align:center;
  }
  .stat span.lbl{ display:block; font-size:11px; color:#636e72; font-weight:600; margin-bottom:2px;}
  .stat span.val{ font-size:20px; color:#6c5ce7;}

  .board{
    display:grid; gap:10px; margin:0 auto; justify-content:center;
  }
  .card{
    perspective:1000px; cursor:pointer; aspect-ratio:1/1;
    width: clamp(40px, 11vw, 100px);
  }
  .card-inner{
    position:relative; width:100%; height:100%; transition:transform .45s;
    transform-style:preserve-3d;
  }
  .card.flipped .card-inner{ transform:rotateY(180deg); }
  .card.matched .card-inner{ animation:pop .5s ease; }
  @keyframes pop{
    0%{ transform:rotateY(180deg) scale(1); }
    50%{ transform:rotateY(180deg) scale(1.15); }
    100%{ transform:rotateY(180deg) scale(1); }
  }
  .card-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:14px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.15);
  }
  .card-back{
    background:linear-gradient(145deg, var(--card-back1), var(--card-back2));
    font-size:clamp(18px,4vw,34px); color:#fff;
  }
  .card-front{
    background:#fff; transform:rotateY(180deg);
    font-size:clamp(18px,5vw,40px); font-weight:bold;
  }
  .card.matched .card-front{ background:#eafff1; box-shadow:0 0 0 3px #2ecc71 inset, 0 4px 10px rgba(0,0,0,0.15); }
  .color-swatch{ width:70%; height:70%; border-radius:50%; box-shadow:inset 0 0 0 4px rgba(255,255,255,0.6); }

  /* Win overlay */
  .overlay{
    position:fixed; inset:0; background:rgba(45,52,54,0.6);
    display:flex; align-items:center; justify-content:center; z-index:50;
    padding:16px;
  }
  .win-box{
    background:#fff; border-radius:24px; padding:32px; max-width:420px; width:100%;
    text-align:center; box-shadow:0 20px 60px rgba(0,0,0,0.4); position:relative; overflow:hidden;
  }
  .win-box h2{ font-size:30px; color:#e84393; margin:6px 0;}
  .win-stats{ display:flex; justify-content:center; gap:20px; margin:18px 0;}
  .win-stats div{ background:#f8f8ff; border-radius:14px; padding:12px 16px;}
  .win-stats span.v{ display:block; font-size:22px; font-weight:bold; color:#6c5ce7;}
  .win-stats span.l{ font-size:12px; color:#636e72;}
  .win-actions{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:10px;}
  .primary-btn{
    background:linear-gradient(145deg,#6c5ce7,#a29bfe); color:#fff; border:none; padding:12px 22px;
    border-radius:16px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:15px;
    box-shadow:0 6px 0 #4834d4;
  }
  .primary-btn:active{ transform:translateY(2px); box-shadow:0 4px 0 #4834d4; }
  .secondary-btn{
    background:#dfe6e9; color:#2d3436; border:none; padding:12px 22px;
    border-radius:16px; font-weight:bold; cursor:pointer; font-family:inherit; font-size:15px;
    box-shadow:0 6px 0 #b2bec3;
  }
  .secondary-btn:active{ transform:translateY(2px); box-shadow:0 4px 0 #b2bec3; }

  .confetti{
    position:absolute; top:-20px; width:10px; height:16px; opacity:0.9;
    animation: fall linear forwards;
  }
  @keyframes fall{
    to{ transform:translateY(520px) rotate(360deg); opacity:0.2; }
  }

  .hint{ text-align:center; color:#636e72; font-size:13px; margin-top:6px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ---------- DATA ---------- */
const ANIMALS = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🙈','🙉','🙊','🐺','🦄','🐝','🐛','🦋','🐌','🐢','🐍','🦎','🐙','🦓','🦒','🦌','🐘'];
const BIRDS = ['🦅','🦆','🦉','🦜','🐔','🐓','🐤','🐣','🐥','🐧','🦢','🦩','🦃','🦚','🐦','🕊️','🦤','🪿'];
const COLORS = ['#e74c3c','#c0392b','#e67e22','#d35400','#f1c40f','#f39c12','#2ecc71','#27ae60','#1abc9c','#16a085','#3498db','#2980b9','#9b59b6','#8e44ad','#e84393','#fd79a8','#fdcb6e','#ffeaa7','#55efc4','#81ecec','#74b9ff','#a29bfe','#636e72','#2d3436','#00b894','#00cec9','#0984e3','#6c5ce7','#ff7675','#ffa502','#7bed9f','#70a1ff'];
const NUMBERS = Array.from({length:32}, (_,i)=>String(i+1));
const LETTERS = ['А','Б','В','Г','Д','Е','Ж','З','И','Й','К','Л','М','Н','О','П','Р','С','Т','У','Ф','Х','Ц','Ч','Ш','Щ','Ъ','Ь','Ю','Я'];
const TEXT_COLORS = ['#e74c3c','#3498db','#2ecc71','#9b59b6','#e67e22','#16a085','#d35400','#2980b9','#e84393','#00b894'];

function toItems(arr, type){
  return arr.map((v,i)=>({type, value:v, tColor: TEXT_COLORS[i % TEXT_COLORS.length]}));
}

const CATEGORIES = [
  { id:'animals', name:'Животни', icon:'🐶', pool: toItems(ANIMALS,'emoji') },
  { id:'birds',   name:'Птици',   icon:'🦜', pool: toItems(BIRDS,'emoji') },
  { id:'colors',  name:'Цветове', icon:'🎨', pool: toItems(COLORS,'color') },
  { id:'numbers', name:'Числа',   icon:'🔢', pool: toItems(NUMBERS,'text') },
  { id:'letters', name:'Букви',   icon:'🔤', pool: toItems(LETTERS,'text') },
  { id:'mixed',   name:'Смесено', icon:'🌈', pool: [
      ...toItems(ANIMALS.slice(0,10),'emoji'),
      ...toItems(BIRDS.slice(0,10),'emoji'),
      ...toItems(COLORS.slice(0,6),'color'),
      ...toItems(NUMBERS.slice(0,6),'text'),
    ]},
];

const SIZES = [
  { id:'small',  name:'Малка',   pairs:8,  cols:4, badge:'⚡ Бърза игра' },
  { id:'medium', name:'Средна',  pairs:18, cols:6, badge:'⏱ Средно дълга' },
  { id:'large',  name:'Голяма',  pairs:24, cols:8, badge:'🔥 Дълга игра' },
  { id:'huge',   name:'Огромна', pairs:32, cols:8, badge:'🏆 Маратон!' },
];

/* ---------- STATE ---------- */
let state = {
  screen:'category',
  category:null,
  size:null,
  cards:[],
  firstIdx:null,
  secondIdx:null,
  lock:false,
  moves:0,
  matches:0,
  seconds:0,
  timer:null,
  finished:false,
};

const app = document.getElementById('app');

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function fmtTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return m+':'+sec;
}

/* ---------- RENDER: CATEGORY SCREEN ---------- */
function renderCategoryScreen(){
  app.innerHTML = `
    <div class="panel">
      <h1>🧠 Игра на паметта</h1>
      <div class="subtitle">Избери тема, с която искаш да играеш</div>
      <div class="grid-select">
        ${CATEGORIES.map(c => `
          <button class="opt-btn" data-action="pick-category" data-id="${c.id}">
            <span class="icon">${c.icon}</span>
            <span>${c.name}</span>
          </button>
        `).join('')}
      </div>
    </div>
  `;
}

/* ---------- RENDER: SIZE SCREEN ---------- */
function renderSizeScreen(){
  const cat = state.category;
  app.innerHTML = `
    <div class="panel">
      <div class="back-row">
        <button class="nav-btn" data-action="back-to-category">⬅ Назад</button>
        <div style="font-weight:bold; color:#6c5ce7;">${cat.icon} ${cat.name}</div>
        <div style="width:90px;"></div>
      </div>
      <h1 style="font-size:clamp(22px,4vw,32px);">Избери размер на играта</h1>
      <div class="subtitle">По-голяма дъска = по-дълга и по-предизвикателна игра</div>
      <div class="grid-select">
        ${SIZES.map(s => {
          const enough = cat.pool.length >= s.pairs;
          const recClass = s.id === 'large' ? 'recommended' : '';
          return `
            <button class="opt-btn size-card ${enough? '' : 'disabled'} ${recClass}"
              data-action="${enough ? 'pick-size' : ''}" data-id="${s.id}" ${enough?'':'disabled'}>
              <span class="badge">${s.badge}</span>
              <span style="font-size:20px;">${s.name}</span>
              <span class="pairs">${s.pairs} двойки · ${s.pairs*2} карти</span>
              ${enough ? '' : '<span class="pairs" style="color:#e74c3c;">Нужни са повече символи</span>'}
            </button>
          `;
        }).join('')}
      </div>
    </div>
  `;
}

/* ---------- GAME LOGIC ---------- */
function startGame(){
  const pool = shuffle(state.category.pool).slice(0, state.size.pairs);
  const doubled = shuffle([...pool, ...pool]);
  state.cards = doubled.map((item, idx) => ({
    uid: idx, item, flipped:false, matched:false
  }));
  state.firstIdx = null;
  state.secondIdx = null;
  state.lock = false;
  state.moves = 0;
  state.matches = 0;
  state.seconds = 0;
  state.finished = false;
  if(state.timer) clearInterval(state.timer);
  state.timer = null;
  state.screen = 'game';
  renderGameScreen();
}

function startTimerIfNeeded(){
  if(!state.timer){
    state.timer = setInterval(()=>{
      state.seconds++;
      const el = document.getElementById('timer-val');
      if(el) el.textContent = fmtTime(state.seconds);
    }, 1000);
  }
}

function renderCardFace(item){
  if(item.type === 'color'){
    return `<div class="color-swatch" style="background:${item.value};"></div>`;
  }
  if(item.type === 'text'){
    return `<span style="color:${item.tColor};">${item.value}</span>`;
  }
  return `<span>${item.value}</span>`;
}

function renderGameScreen(){
  const s = state.size;
  app.innerHTML = `
    <div class="panel">
      <div class="back-row">
        <button class="nav-btn" data-action="back-to-category">🏠 Начало</button>
        <div style="font-weight:bold; color:#6c5ce7;">${state.category.icon} ${state.category.name} · ${s.name}</div>
        <button class="nav-btn" data-action="restart-game">🔄 Отначало</button>
      </div>
      <div class="stat-bar">
        <div class="stat"><span class="lbl">ВРЕМЕ</span><span class="val" id="timer-val">${fmtTime(state.seconds)}</span></div>
        <div class="stat"><span class="lbl">ОПИТИ</span><span class="val" id="moves-val">${state.moves}</span></div>
        <div class="stat"><span class="lbl">ДВОЙКИ</span><span class="val" id="matches-val">${state.matches}/${s.pairs}</span></div>
      </div>
      <div class="board" id="board" style="grid-template-columns:repeat(${s.cols}, 1fr); max-width:${s.cols*100}px;">
        ${state.cards.map((c) => `
          <div class="card ${c.flipped || c.matched ? 'flipped':''} ${c.matched?'matched':''}" data-action="flip-card" data-uid="${c.uid}">
            <div class="card-inner">
              <div class="card-face card-back">❓</div>
              <div class="card-face card-front">${renderCardFace(c.item)}</div>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="hint">Намери всички еднакви двойки, като обръщаш по две карти наведнъж 🙂</div>
    </div>
  `;
}

function updateStatsBarOnly(){
  const mv = document.getElementById('moves-val');
  const mt = document.getElementById('matches-val');
  if(mv) mv.textContent = state.moves;
  if(mt) mt.textContent = `${state.matches}/${state.size.pairs}`;
}

function flipCard(uid){
  if(state.lock || state.finished) return;
  const card = state.cards.find(c => c.uid === uid);
  if(!card || card.flipped || card.matched) return;

  startTimerIfNeeded();
  card.flipped = true;

  const cardEl = document.querySelector(`.card[data-uid="${uid}"]`);
  if(cardEl) cardEl.classList.add('flipped');

  if(state.firstIdx === null){
    state.firstIdx = uid;
    return;
  }
  state.secondIdx = uid;
  state.lock = true;
  state.moves++;
  updateStatsBarOnly();

  const first = state.cards.find(c => c.uid === state.firstIdx);
  const second = state.cards.find(c => c.uid === state.secondIdx);

  const isMatch = first.item.type === second.item.type && first.item.value === second.item.value;

  if(isMatch){
    setTimeout(()=>{
      first.matched = true; second.matched = true;
      state.matches++;
      const f1 = document.querySelector(`.card[data-uid="${first.uid}"]`);
      const f2 = document.querySelector(`.card[data-uid="${second.uid}"]`);
      if(f1) f1.classList.add('matched');
      if(f2) f2.classList.add('matched');
      updateStatsBarOnly();
      state.firstIdx = null; state.secondIdx = null; state.lock = false;
      if(state.matches === state.size.pairs){
        finishGame();
      }
    }, 350);
  } else {
    setTimeout(()=>{
      first.flipped = false; second.flipped = false;
      const f1 = document.querySelector(`.card[data-uid="${first.uid}"]`);
      const f2 = document.querySelector(`.card[data-uid="${second.uid}"]`);
      if(f1) f1.classList.remove('flipped');
      if(f2) f2.classList.remove('flipped');
      state.firstIdx = null; state.secondIdx = null; state.lock = false;
    }, 900);
  }
}

function finishGame(){
  state.finished = true;
  if(state.timer){ clearInterval(state.timer); state.timer = null; }
  showWinOverlay();
}

function showWinOverlay(){
  const colors = ['#e74c3c','#f1c40f','#2ecc71','#3498db','#9b59b6','#e84393','#ffa502'];
  let confettiHtml = '';
  for(let i=0;i<60;i++){
    const left = Math.random()*100;
    const delay = Math.random()*0.6;
    const dur = 1.8 + Math.random()*1.4;
    const col = colors[i % colors.length];
    confettiHtml += `<div class="confetti" style="left:${left}%; background:${col}; animation-delay:${delay}s; animation-duration:${dur}s;"></div>`;
  }

  const overlay = document.createElement('div');
  overlay.className = 'overlay';
  overlay.innerHTML = `
    <div class="win-box">
      ${confettiHtml}
      <div style="font-size:50px;">🎉🏆🎉</div>
      <h2>Браво! Спечели!</h2>
      <div class="win-stats">
        <div><span class="v">${fmtTime(state.seconds)}</span><span class="l">ВРЕМЕ</span></div>
        <div><span class="v">${state.moves}</span><span class="l">ОПИТИ</span></div>
        <div><span class="v">${state.size.pairs}</span><span class="l">ДВОЙКИ</span></div>
      </div>
      <div class="win-actions">
        <button class="primary-btn" data-action="restart-game">🔄 Играй пак</button>
        <button class="secondary-btn" data-action="back-to-category">🏠 Друга тема</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
}

/* ---------- EVENTS ---------- */
document.addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-action]');
  if(!btn) return;
  const action = btn.getAttribute('data-action');
  const id = btn.getAttribute('data-id');

  if(action === 'pick-category'){
    state.category = CATEGORIES.find(c => c.id === id);
    state.screen = 'size';
    renderSizeScreen();
  }
  else if(action === 'pick-size'){
    state.size = SIZES.find(s => s.id === id);
    startGame();
  }
  else if(action === 'back-to-category'){
    document.querySelectorAll('.overlay').forEach(o => o.remove());
    if(state.timer){ clearInterval(state.timer); state.timer = null; }
    state.screen = 'category';
    renderCategoryScreen();
  }
  else if(action === 'restart-game'){
    document.querySelectorAll('.overlay').forEach(o => o.remove());
    startGame();
  }
  else if(action === 'flip-card'){
    const uid = parseInt(btn.getAttribute('data-uid'), 10);
    flipCard(uid);
  }
});

/* ---------- INIT ---------- */
renderCategoryScreen();
</script>
</body>
</html>
