<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Капитан Безопасност — Природни бедствия</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#EAF6FB;
    --navy:#1F2A44;
    --alert:#FF5A36;
    --alert-dark:#D8431F;
    --safe:#3FB56D;
    --safe-dark:#2E8F54;
    --sun:#FFC93C;
    --teal:#4FB0C6;
    --card-shadow:0 10px 0 rgba(31,42,68,0.12);
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Nunito',sans-serif;
    color:var(--navy);
    background:var(--sky);
    background-image:
      radial-gradient(circle at 8% 12%, rgba(255,201,60,0.32) 0, transparent 42%),
      radial-gradient(circle at 92% 88%, rgba(63,181,109,0.24) 0, transparent 46%);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    transition:background-color .5s ease;
  }
  body.mode-alert{background-color:#FFF0EA;}
  body.mode-safe{background-color:#EAF9F0;}
  h1,h2,.display{font-family:'Baloo 2',cursive;}

  header.topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 22px; gap:14px; flex-wrap:wrap;
  }
  .brand{display:flex; align-items:center; gap:10px; font-family:'Baloo 2',cursive; font-weight:700; font-size:1.2rem;}
  .brand .hero{font-size:1.8rem;}
  .progress-dots{display:flex; gap:7px; flex-wrap:wrap; justify-content:center;}
  .dot{width:13px;height:13px;border-radius:50%; background:rgba(31,42,68,0.18); transition:all .25s ease;}
  .dot.active{background:var(--alert); transform:scale(1.4);}
  .dot.done{background:var(--safe);}
  .mute-btn{
    border:none; background:white; box-shadow:var(--card-shadow); border-radius:999px;
    padding:8px 16px; font-size:1.1rem; cursor:pointer; font-family:'Baloo 2',cursive; font-weight:700;
  }

  main{flex:1; display:flex; align-items:center; justify-content:center; padding:8px 18px 26px;}
  .stage{
    width:100%; max-width:920px; background:white; border-radius:32px;
    box-shadow:0 18px 0 rgba(31,42,68,0.10), 0 22px 44px rgba(31,42,68,0.10);
    padding:34px 38px 30px; animation:pop .35s ease; text-align:center;
  }
  @keyframes pop{ from{opacity:0; transform:translateY(14px) scale(.98);} to{opacity:1; transform:translateY(0) scale(1);} }

  .stage h2{margin:4px 0 4px; font-size:2rem;}
  .stage .subtitle{margin:0 0 6px; font-size:1.15rem; color:#5a6478; font-weight:800;}

  .replay-btn{
    border:none; background:var(--teal); color:white; font-family:'Baloo 2',cursive;
    font-weight:700; font-size:.95rem; padding:8px 20px; border-radius:999px; cursor:pointer;
    margin:6px 0 20px; box-shadow:0 5px 0 #357f92;
  }
  .replay-btn:active{transform:translateY(3px); box-shadow:none;}

  .step-row{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; margin:14px 0 10px;}
  .step-card{
    background:var(--sky); border-radius:24px; padding:20px 18px; width:170px;
    box-shadow:0 6px 0 rgba(31,42,68,0.08);
  }
  .step-card .num{
    display:inline-flex; align-items:center; justify-content:center; width:34px; height:34px;
    border-radius:50%; background:var(--alert); color:white; font-family:'Baloo 2',cursive;
    font-weight:800; font-size:1.1rem; margin-bottom:8px;
  }
  .step-card .emoji{font-size:3.6rem; display:block; margin-bottom:6px;}
  .step-card .word{font-family:'Baloo 2',cursive; font-weight:800; font-size:1.2rem;}

  .cards{display:flex; flex-wrap:wrap; gap:18px; justify-content:center; margin:16px 0 6px;}
  .choice-card{
    background:var(--sky); border:4px solid transparent; border-radius:22px;
    padding:20px 18px; text-align:center; width:180px; cursor:pointer; transition:all .18s ease; user-select:none;
  }
  .choice-card:hover{transform:translateY(-4px) scale(1.02); box-shadow:var(--card-shadow);}
  .choice-card .emoji{font-size:3.6rem; display:block; margin-bottom:8px;}
  .choice-card .word{font-family:'Baloo 2',cursive; font-weight:800; font-size:1.05rem;}
  .choice-card.correct{border-color:var(--safe); background:#EAF9EE;}
  .choice-card.wrong{border-color:var(--alert); background:#FFEFEC;}
  .choice-card .fb{display:none; margin-top:8px; font-weight:800; font-size:1rem;}
  .choice-card.answered .fb{display:block;}
  .choice-card.correct .fb{color:var(--safe-dark);}
  .choice-card.wrong .fb{color:var(--alert-dark);}
  .choice-card.correct .emoji{animation:pingpop .5s ease;}
  @keyframes pingpop{ 0%{transform:scale(1);} 50%{transform:scale(1.25);} 100%{transform:scale(1);} }

  .big-emoji{font-size:5.5rem; animation:bounce 1.7s infinite ease-in-out;}
  @keyframes bounce{ 0%,100%{transform:translateY(0) rotate(-3deg);} 50%{transform:translateY(-16px) rotate(3deg);} }
  .visual-row{display:flex; align-items:center; justify-content:center; gap:26px; margin:10px 0 18px; flex-wrap:wrap;}

  .siren-btn{
    border:none; background:var(--alert); color:white; font-family:'Baloo 2',cursive;
    font-weight:700; font-size:1rem; padding:10px 22px; border-radius:999px; cursor:pointer;
    box-shadow:0 5px 0 var(--alert-dark); margin-bottom:14px;
  }
  .siren-btn:active{transform:translateY(3px); box-shadow:none;}

  .emergency-box{
    background:var(--alert); color:white; border-radius:22px; padding:22px; margin:18px 0;
    box-shadow:0 8px 0 var(--alert-dark);
  }
  .emergency-box .num{font-family:'Baloo 2',cursive; font-size:3.6rem; font-weight:800;}
  .emergency-box .label{font-weight:800; font-size:1.05rem;}

  .skills-list{list-style:none; padding:0; margin:16px auto 0; max-width:520px; display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .skills-list li{
    background:var(--sky); border-radius:14px; padding:12px 14px; font-weight:800; font-size:1rem;
    display:flex; align-items:center; gap:8px; text-align:left;
  }

  details.teacher-note{
    text-align:left; margin-top:18px; background:#F1F5FA; border-radius:14px; padding:10px 16px;
    font-size:.92rem; color:#3a4458;
  }
  details.teacher-note summary{cursor:pointer; font-weight:800; color:var(--navy);}

  .nav-row{display:flex; align-items:center; justify-content:space-between; margin-top:24px; gap:12px; flex-wrap:wrap;}
  .nav-btn{
    border:none; font-family:'Baloo 2',cursive; font-weight:800; font-size:1.1rem;
    padding:14px 30px; border-radius:999px; cursor:pointer; transition:all .15s ease;
  }
  .nav-btn.primary{background:var(--alert); color:white; box-shadow:0 6px 0 var(--alert-dark);}
  .nav-btn.primary:active{transform:translateY(4px); box-shadow:none;}
  .nav-btn.secondary{background:transparent; color:var(--navy); border:2px solid #d6dde6;}
  .nav-btn.secondary:hover{background:#f2f5f8;}
  .nav-btn:disabled{opacity:.35; cursor:not-allowed;}
  .nav-btn.restart{background:var(--teal); color:white; box-shadow:0 6px 0 #357f92;}

  footer{text-align:center; padding:10px; font-size:.8rem; color:#8a93a5;}

  @media (max-width:640px){
    .stage{padding:26px 18px 24px;}
    .stage h2{font-size:1.5rem;}
    .skills-list{grid-template-columns:1fr;}
  }
</style>
</head>
<body class="mode-safe">

<header class="topbar">
  <div class="brand"><span class="hero">🦝</span> Капитан Безопасност</div>
  <div class="progress-dots" id="dots"></div>
  <button class="mute-btn" id="muteBtn" onclick="toggleMute()">🔊 Звук: Вкл.</button>
</header>

<main><div class="stage" id="stage"></div></main>

<footer>Игра по ОН ОС · тема „Природни бедствия“ · за деца на 6 години</footer>

<script>
/* ---------- speech ---------- */
let muted = false;
function toggleMute(){
  muted = !muted;
  document.getElementById('muteBtn').textContent = muted ? '🔇 Звук: Изкл.' : '🔊 Звук: Вкл.';
  if(muted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
}
function speak(text){
  if(muted || !('speechSynthesis' in window)) return;
  try{
    const u = new SpeechSynthesisUtterance(text);
    u.lang='bg-BG'; u.rate=0.88; u.pitch=1.05;
    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(u);
  }catch(e){}
}
/* ---------- tone feedback ---------- */
let actx;
function tone(freq, dur, type='sine'){
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const o = actx.createOscillator();
    const g = actx.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(0.15, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, actx.currentTime+dur);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}
function playCorrect(){ tone(660,.12); setTimeout(()=>tone(880,.18),120); }
function playWrong(){ tone(220,.25,'sawtooth'); }
function playSiren(){
  let f=440, up=true, count=0;
  const iv=setInterval(()=>{
    tone(f,.18,'sine');
    f = up ? f+90 : f-90;
    if(f>760) up=false; if(f<440) up=true;
    count++;
    if(count>7) clearInterval(iv);
  },190);
}

/* ---------- render helpers ---------- */
function stepCard(num, emoji, word){
  return `<div class="step-card">
      <div class="num">${num}</div>
      <span class="emoji">${emoji}</span>
      <span class="word">${word}</span>
    </div>`;
}
function choiceCard(emoji, word, isCorrect, feedback){
  return `<div class="choice-card" onclick="checkChoice(this)" data-correct="${isCorrect}">
      <span class="emoji">${emoji}</span>
      <span class="word">${word}</span>
      <div class="fb">${feedback}</div>
    </div>`;
}
window.checkChoice = function(el){
  if(el.classList.contains('answered')) return;
  const ok = el.getAttribute('data-correct') === 'true';
  el.classList.add('answered', ok ? 'correct' : 'wrong');
  if(ok){ playCorrect(); } else { playWrong(); }
};

/* ---------- stage data ---------- */
const stages = [

{ mode:'safe', narration:'Здравейте, приятели! Аз съм Капитан Безопасност. Днес ще научим какво да правим, ако стане земетресение, пожар или силна буря.',
  render:()=>`
    <div class="big-emoji">🦝🦺</div>
    <h2>Капитан Безопасност</h2>
    <p class="subtitle">Игра за природните бедствия</p>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <details class="teacher-note"><summary>За учителя</summary>
      Играта има 3 модула: Земетресение, Пожар и Буря — всеки с прости стъпки за поведение и игра за упражнение, плюс финал с телефон 112. Всеки екран се изчита на глас автоматично — децата не е нужно да четат сами.
    </details>`
},

{ mode:'safe', narration:'Ако земята потрепери, запомнете три вълшебни стъпки. Първо — клекни. Второ — покрий се. Трето — дръж се здраво.',
  round:'Земетресение', render:()=>`
    <h2>🌍💥 Земетресение</h2>
    <p class="subtitle">Клекни — Покрий се — Дръж се</p>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <div class="step-row">
      ${stepCard(1,'🙇','Клекни')}
      ${stepCard(2,'🛡️','Покрий се')}
      ${stepCard(3,'🤲','Дръж се')}
    </div>`
},

{ mode:'alert', narration:'Земята затрепери! Кои картинки показват правилно поведение? Докосни ги и виж!',
  round:'Земетресение · Игра', render:()=>`
    <h2>🌍 Кое е правилно?</h2>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <div class="cards">
      ${choiceCard('🪑🙇','До здрава маса','true','Браво! Точно така!')}
      ${choiceCard('🏃‍♂️🚪','Тичаме навън','false','Не бива — опасно е!')}
      ${choiceCard('🛡️🤲','Покриваме главата','true','Отлично!')}
      ${choiceCard('🪟','До прозореца','false','Стъклото не е безопасно.')}
    </div>`
},

{ mode:'safe', narration:'Ако дрехите ни се запалят, никога не тичаме. Правим три стъпки. Спри. Падни. Търкаляй се.',
  round:'Пожар', render:()=>`
    <h2>🔥 Пожар</h2>
    <p class="subtitle">Спри — Падни — Търкаляй се</p>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <div class="step-row">
      ${stepCard(1,'✋','Спри')}
      ${stepCard(2,'⬇️','Падни')}
      ${stepCard(3,'🔄','Търкаляй се')}
    </div>`
},

{ mode:'alert', narration:'Мирише на дим! Какво трябва да направим веднага?',
  round:'Пожар · Игра', render:()=>`
    <h2>🔥 Какво правим?</h2>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <div class="cards">
      ${choiceCard('🚪🚶','Излизаме навън','true','Точно така — на безопасно място!')}
      ${choiceCard('🛏️','Крием се под леглото','false','Не! Излизаме навън.')}
      ${choiceCard('📞','Викаме възрастен','true','Чудесно решение!')}
      ${choiceCard('🧸','Взимаме играчка','false','Играчките чакат — първо сме в безопасност.')}
    </div>`
},

{ mode:'safe', narration:'Чуваме силен вятър и гръмотевици. Стоим вкъщи, далеч от прозорци, и чакаме спокойно.',
  round:'Буря', render:()=>`
    <h2>⛈️ Силна буря</h2>
    <p class="subtitle">Оставаме на сигурно място</p>
    <button class="siren-btn" onclick="playSiren()">🔊 Чуй звук на буря</button>
    <div class="step-row">
      ${stepCard(1,'🏠','Стоим вкъщи')}
      ${stepCard(2,'🪟','Далеч от прозорци')}
      ${stepCard(3,'🕯️','Чакаме спокойно')}
    </div>`
},

{ mode:'alert', narration:'Гърми навън! Кое място е най-безопасно?',
  round:'Буря · Игра', render:()=>`
    <h2>⛈️ Къде е безопасно?</h2>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <div class="cards">
      ${choiceCard('🛋️','В стаята вкъщи','true','Точно тук е безопасно!')}
      ${choiceCard('🌳','Под дърво навън','false','Опасно! Дърветата привличат мълнии.')}
      ${choiceCard('🏡','С възрастните','true','Чудесно!')}
      ${choiceCard('⚽','Играем навън','false','Не сега — изчакваме бурята вкъщи.')}
    </div>`
},

{ mode:'safe', narration:'Браво, малки герои! Винаги при опасност търсим възрастен и звъним на сто и дванайсет.',
  render:()=>`
    <div class="big-emoji">🌟🦝</div>
    <h2>Браво, малки герои!</h2>
    <button class="replay-btn" onclick="speak(stages[current].narration)">🔊 Слушай пак</button>
    <div class="emergency-box">
      <div class="label">При опасност звъним на</div>
      <div class="num">112</div>
    </div>
    <ul class="skills-list">
      <li>🙇 Клекни, покрий се, дръж се</li>
      <li>🔄 Спри, падни, търкаляй се</li>
      <li>🏠 Стоим на сигурно място</li>
      <li>📞 Търсим помощ от възрастен</li>
    </ul>`
}
];

/* ---------- engine ---------- */
let current = 0;
function renderDots(){
  document.getElementById('dots').innerHTML = stages.map((s,i)=>{
    let cls='dot';
    if(i===current) cls+=' active'; else if(i<current) cls+=' done';
    return `<span class="${cls}"></span>`;
  }).join('');
}
function renderStage(){
  const s = stages[current];
  document.body.classList.remove('mode-alert','mode-safe');
  document.body.classList.add(s.mode==='alert' ? 'mode-alert':'mode-safe');

  const stageEl = document.getElementById('stage');
  let inner = s.render();
  inner += `<div class="nav-row">
      <button class="nav-btn secondary" onclick="prevStage()" ${current===0?'disabled':''}>⬅ Назад</button>
      <button class="nav-btn restart" onclick="restart()">↺ Начало</button>
      <button class="nav-btn primary" onclick="nextStage()" ${current===stages.length-1?'disabled':''}>Напред ➡</button>
    </div>`;
  stageEl.innerHTML = inner;
  renderDots();
  if(s.narration) speak(s.narration);
}
function nextStage(){ if(current<stages.length-1){current++; renderStage();} }
function prevStage(){ if(current>0){current--; renderStage();} }
function restart(){ current=0; renderStage(); }
document.addEventListener('keydown',(e)=>{ if(e.key==='ArrowRight') nextStage(); if(e.key==='ArrowLeft') prevStage(); });

renderStage();
</script>
</body>
</html>
