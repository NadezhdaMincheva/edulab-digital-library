<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открий следващото! - Игра за последователности</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-25px); }
        }
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        .animate-bounce { animation: bounce 1s infinite; }
        .animate-spin { animation: spin 3s linear infinite; }
        .animate-pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script>
        const { createElement: h } = React = {
            createElement: (tag, props, ...children) => {
                if (typeof tag === 'function') return tag(props || {});
                const el = document.createElement(tag);
                if (props) {
                    Object.entries(props).forEach(([key, val]) => {
                        if (key === 'className') el.className = val;
                        else if (key === 'style') Object.assign(el.style, val);
                        else if (key.startsWith('on')) el.addEventListener(key.slice(2).toLowerCase(), val);
                        else el.setAttribute(key, val);
                    });
                }
                children.flat(Infinity).forEach(child => {
                    el.appendChild(typeof child === 'string' ? document.createTextNode(child) : child);
                });
                return el;
            }
        };

        let state = {
            currentLevel: 0,
            score: 0,
            showFeedback: false,
            isCorrect: false,
            gameComplete: false
        };

        const levels = [
            {
                type: 'seasons',
                title: '🌈 Сезони',
                sequence: [
                    { emoji: '🌸', text: 'Пролет', color: 'from-pink-300 to-green-300' },
                    { emoji: '☀️', text: 'Лято', color: 'from-yellow-300 to-orange-300' },
                    { emoji: '🍂', text: 'Есен', color: 'from-orange-300 to-red-300' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '❄️', text: 'Зима', color: 'from-blue-300 to-cyan-300' },
                options: [
                    { emoji: '❄️', text: 'Зима', color: 'from-blue-300 to-cyan-300' },
                    { emoji: '🌸', text: 'Пролет', color: 'from-pink-300 to-green-300' },
                    { emoji: '☀️', text: 'Лято', color: 'from-yellow-300 to-orange-300' }
                ]
            },
            {
                type: 'numbers',
                title: '🔢 Числа',
                sequence: [
                    { emoji: '1️⃣', text: '1', color: 'from-red-400 to-pink-400' },
                    { emoji: '2️⃣', text: '2', color: 'from-orange-400 to-yellow-400' },
                    { emoji: '3️⃣', text: '3', color: 'from-green-400 to-teal-400' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '4️⃣', text: '4', color: 'from-blue-400 to-indigo-400' },
                options: [
                    { emoji: '5️⃣', text: '5', color: 'from-purple-400 to-pink-400' },
                    { emoji: '4️⃣', text: '4', color: 'from-blue-400 to-indigo-400' },
                    { emoji: '2️⃣', text: '2', color: 'from-orange-400 to-yellow-400' }
                ]
            },
            {
                type: 'days',
                title: '📅 Дни от седмицата',
                sequence: [
                    { emoji: '🌅', text: 'Понеделник', color: 'from-yellow-300 to-orange-300' },
                    { emoji: '🌞', text: 'Вторник', color: 'from-orange-300 to-red-300' },
                    { emoji: '🌤️', text: 'Сряда', color: 'from-blue-300 to-cyan-300' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '⭐', text: 'Четвъртък', color: 'from-green-300 to-teal-300' },
                options: [
                    { emoji: '⭐', text: 'Четвъртък', color: 'from-green-300 to-teal-300' },
                    { emoji: '🎉', text: 'Петък', color: 'from-pink-300 to-purple-300' },
                    { emoji: '🌈', text: 'Неделя', color: 'from-red-300 to-pink-300' }
                ]
            },
            {
                type: 'seasons',
                title: '🌈 Сезони',
                sequence: [
                    { emoji: '❄️', text: 'Зима', color: 'from-blue-300 to-cyan-300' },
                    { emoji: '🌸', text: 'Пролет', color: 'from-pink-300 to-green-300' },
                    { emoji: '☀️', text: 'Лято', color: 'from-yellow-300 to-orange-300' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '🍂', text: 'Есен', color: 'from-orange-300 to-red-300' },
                options: [
                    { emoji: '🍂', text: 'Есен', color: 'from-orange-300 to-red-300' },
                    { emoji: '❄️', text: 'Зима', color: 'from-blue-300 to-cyan-300' },
                    { emoji: '🌸', text: 'Пролет', color: 'from-pink-300 to-green-300' }
                ]
            },
            {
                type: 'numbers',
                title: '🔢 Числа',
                sequence: [
                    { emoji: '2️⃣', text: '2', color: 'from-orange-400 to-yellow-400' },
                    { emoji: '3️⃣', text: '3', color: 'from-green-400 to-teal-400' },
                    { emoji: '4️⃣', text: '4', color: 'from-blue-400 to-indigo-400' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '5️⃣', text: '5', color: 'from-purple-400 to-pink-400' },
                options: [
                    { emoji: '1️⃣', text: '1', color: 'from-red-400 to-pink-400' },
                    { emoji: '5️⃣', text: '5', color: 'from-purple-400 to-pink-400' },
                    { emoji: '6️⃣', text: '6', color: 'from-pink-400 to-red-400' }
                ]
            },
            {
                type: 'days',
                title: '📅 Дни от седмицата',
                sequence: [
                    { emoji: '🎉', text: 'Петък', color: 'from-pink-300 to-purple-300' },
                    { emoji: '🎈', text: 'Събота', color: 'from-purple-300 to-indigo-300' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '🌈', text: 'Неделя', color: 'from-red-300 to-pink-300' },
                options: [
                    { emoji: '🌈', text: 'Неделя', color: 'from-red-300 to-pink-300' },
                    { emoji: '🌅', text: 'Понеделник', color: 'from-yellow-300 to-orange-300' },
                    { emoji: '⭐', text: 'Четвъртък', color: 'from-green-300 to-teal-300' }
                ]
            },
            {
                type: 'numbers',
                title: '🔢 Числа',
                sequence: [
                    { emoji: '3️⃣', text: '3', color: 'from-green-400 to-teal-400' },
                    { emoji: '4️⃣', text: '4', color: 'from-blue-400 to-indigo-400' },
                    { emoji: '5️⃣', text: '5', color: 'from-purple-400 to-pink-400' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' }
                ],
                correct: { emoji: '6️⃣', text: '6', color: 'from-pink-400 to-red-400' },
                options: [
                    { emoji: '6️⃣', text: '6', color: 'from-pink-400 to-red-400' },
                    { emoji: '2️⃣', text: '2', color: 'from-orange-400 to-yellow-400' },
                    { emoji: '7️⃣', text: '7', color: 'from-red-400 to-orange-400' }
                ]
            },
            {
                type: 'days',
                title: '📅 Дни от седмицата',
                sequence: [
                    { emoji: '🌅', text: 'Понеделник', color: 'from-yellow-300 to-orange-300' },
                    { emoji: '❓', text: '?', color: 'from-purple-400 to-pink-400' },
                    { emoji: '🌤️', text: 'Сряда', color: 'from-blue-300 to-cyan-300' }
                ],
                correct: { emoji: '🌞', text: 'Вторник', color: 'from-orange-300 to-red-300' },
                options: [
                    { emoji: '🌞', text: 'Вторник', color: 'from-orange-300 to-red-300' },
                    { emoji: '⭐', text: 'Четвъртък', color: 'from-green-300 to-teal-300' },
                    { emoji: '🌈', text: 'Неделя', color: 'from-red-300 to-pink-300' }
                ]
            }
        ];

        function handleAnswer(answer) {
            const level = levels[state.currentLevel];
            const correct = answer.text === level.correct.text;
            
            state.isCorrect = correct;
            state.showFeedback = true;
            
            if (correct) {
                state.score++;
            }
            
            render();
            
            setTimeout(() => {
                state.showFeedback = false;
                if (state.currentLevel < levels.length - 1) {
                    state.currentLevel++;
                } else {
                    state.gameComplete = true;
                }
                render();
            }, 2500);
        }

        function restartGame() {
            state = {
                currentLevel: 0,
                score: 0,
                showFeedback: false,
                isCorrect: false,
                gameComplete: false
            };
            render();
        }

        function render() {
            const app = document.getElementById('app');
            app.innerHTML = '';
            app.appendChild(state.gameComplete ? renderComplete() : renderGame());
        }

        function renderComplete() {
            return h('div', { className: 'min-h-screen bg-gradient-to-br from-purple-500 via-pink-500 to-yellow-400 flex items-center justify-center p-4 relative overflow-hidden' },
                h('div', { className: 'absolute top-10 left-10 text-6xl animate-bounce' }, '🎈'),
                h('div', { className: 'absolute top-20 right-20 text-6xl animate-bounce', style: { animationDelay: '0.5s' } }, '🎉'),
                h('div', { className: 'absolute bottom-20 left-20 text-6xl animate-bounce', style: { animationDelay: '1s' } }, '⭐'),
                h('div', { className: 'absolute bottom-10 right-10 text-6xl animate-bounce', style: { animationDelay: '1.5s' } }, '🌟'),
                h('div', { className: 'bg-white rounded-[3rem] shadow-2xl p-12 max-w-2xl w-full text-center relative z-10 border-8 border-yellow-300' },
                    h('div', { className: 'text-9xl mb-6 animate-bounce' }, '🏆'),
                    h('h1', { className: 'text-6xl font-black bg-gradient-to-r from-purple-600 to-pink-600 text-transparent bg-clip-text mb-6' }, 'БРАВО!'),
                    h('p', { className: 'text-4xl font-bold text-gray-700 mb-6' }, 'Свърши играта!'),
                    h('div', { className: 'flex items-center justify-center gap-4 mb-8 bg-gradient-to-r from-yellow-200 to-orange-200 rounded-3xl p-6' },
                        h('div', { className: 'text-6xl animate-pulse' }, '⭐'),
                        h('p', { className: 'text-6xl font-black text-purple-600' }, state.score),
                        h('p', { className: 'text-4xl font-bold text-gray-600' }, `от ${levels.length}`),
                        h('div', { className: 'text-6xl animate-pulse' }, '⭐')
                    ),
                    h('button', { 
                        className: 'bg-gradient-to-r from-green-500 to-blue-500 text-white text-3xl px-16 py-8 rounded-[2rem] font-black hover:scale-110 transform transition shadow-2xl border-4 border-white',
                        onclick: restartGame
                    }, '🔄 Играй отново!')
                )
            );
        }

        function renderGame() {
            const level = levels[state.currentLevel];
            
            return h('div', { className: 'min-h-screen bg-gradient-to-br from-blue-400 via-purple-400 to-pink-400 p-4 relative overflow-hidden' },
                h('div', { className: 'absolute top-10 left-10 text-5xl animate-pulse' }, '⭐'),
                h('div', { className: 'absolute top-20 right-20 text-5xl animate-pulse', style: { animationDelay: '1s' } }, '🌟'),
                h('div', { className: 'max-w-5xl mx-auto relative z-10' },
                    h('div', { className: 'bg-white rounded-[2.5rem] shadow-2xl p-8 mb-8 border-8 border-yellow-300' },
                        h('div', { className: 'flex items-center justify-between mb-6 flex-wrap gap-4' },
                            h('h1', { className: 'text-5xl font-black bg-gradient-to-r from-purple-600 to-pink-600 text-transparent bg-clip-text' }, '✨ Открий следващото!'),
                            h('button', {
                                className: 'bg-gradient-to-r from-red-500 to-orange-500 text-white px-8 py-4 rounded-2xl font-black text-xl hover:scale-110 transition transform shadow-lg border-4 border-white',
                                onclick: restartGame
                            }, '🔄 Рестарт')
                        ),
                        h('div', { className: 'flex gap-2 mb-4' },
                            ...levels.map((_, idx) => 
                                h('div', {
                                    className: `h-6 flex-1 rounded-full border-4 border-white shadow-lg transition-all duration-500 ${
                                        idx < state.currentLevel ? 'bg-gradient-to-r from-green-400 to-green-500' :
                                        idx === state.currentLevel ? 'bg-gradient-to-r from-blue-400 to-purple-500 animate-pulse' :
                                        'bg-gray-300'
                                    }`
                                })
                            )
                        ),
                        h('div', { className: 'flex items-center justify-between text-2xl font-bold' },
                            h('p', { className: 'text-gray-700' }, `Ниво ${state.currentLevel + 1} от ${levels.length}`),
                            h('div', { className: 'flex items-center gap-2 bg-gradient-to-r from-yellow-300 to-orange-300 px-6 py-3 rounded-2xl' },
                                h('span', {}, '⭐'),
                                h('p', { className: 'text-gray-800 font-black' }, `${state.score} точки`)
                            )
                        )
                    ),
                    h('div', { className: 'bg-white rounded-[2.5rem] shadow-2xl p-10 border-8 border-purple-300' },
                        h('h2', { className: 'text-5xl font-black text-center mb-10 bg-gradient-to-r from-blue-600 to-purple-600 text-transparent bg-clip-text' }, level.title),
                        h('div', { className: 'bg-gradient-to-r from-yellow-100 via-pink-100 to-blue-100 rounded-3xl p-10 mb-10 border-4 border-dashed border-purple-400' },
                            h('p', { className: 'text-3xl text-center text-gray-800 mb-8 font-black' }, '🤔 Каква е последователността?'),
                            h('div', { className: 'flex justify-center gap-6 flex-wrap' },
                                ...level.sequence.map(item =>
                                    h('div', {
                                        className: `text-7xl font-black p-8 rounded-3xl bg-gradient-to-br ${item.color} shadow-2xl min-w-[160px] text-center transform hover:scale-110 transition border-4 border-white ${
                                            item.emoji === '❓' ? 'animate-bounce' : ''
                                        }`
                                    },
                                        h('div', { className: 'mb-2' }, item.emoji),
                                        h('div', { className: 'text-2xl text-white drop-shadow-lg' }, item.text)
                                    )
                                )
                            )
                        ),
                        !state.showFeedback ? 
                            h('div', {},
                                h('p', { className: 'text-3xl text-center text-gray-800 mb-8 font-black' }, '👉 Избери правилния отговор:'),
                                h('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-6' },
                                    ...level.options.map(option =>
                                        h('button', {
                                            className: `bg-gradient-to-br ${option.color} hover:scale-110 text-white text-5xl font-black py-12 px-8 rounded-3xl transform transition shadow-2xl border-4 border-white`,
                                            onclick: () => handleAnswer(option)
                                        },
                                            h('div', { className: 'mb-3' }, option.emoji),
                                            h('div', { className: 'text-3xl drop-shadow-lg' }, option.text)
                                        )
                                    )
                                )
                            ) :
                            h('div', {
                                className: `text-center p-12 rounded-3xl border-8 shadow-2xl ${
                                    state.isCorrect 
                                        ? 'bg-gradient-to-br from-green-200 to-green-300 border-green-500' 
                                        : 'bg-gradient-to-br from-red-200 to-pink-300 border-red-500'
                                }`
                            },
                                h('div', { className: 'text-9xl mb-6 animate-bounce' }, state.isCorrect ? '🎉' : '💪'),
                                h('p', { className: 'text-5xl font-black text-gray-800 drop-shadow-lg' },
                                    state.isCorrect ? 'БРАВО! Правилно!' : 'Почти! Следващия път ще се получи!'
                                )
                            )
                    )
                )
            );
        }

        render();
    </script>
</body>
</html>
