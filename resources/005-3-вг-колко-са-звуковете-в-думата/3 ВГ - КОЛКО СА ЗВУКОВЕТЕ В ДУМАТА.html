<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Колко са звуковете в думата?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #66d9ff 0%, #88ccff 50%, #ffaacc 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            color: white;
            font-size: 3.5em;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.3);
        }

        .score-board {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .score-item {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            color: white;
            padding: 15px 35px;
            border-radius: 30px;
            font-size: 1.8em;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .game-card {
            background: white;
            border-radius: 35px;
            padding: 50px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.3);
            position: relative;
            overflow: hidden;
        }

        .celebration {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, #ffd700 0%, #ffed4e 100%);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 10;
            animation: pulse 0.5s ease-in-out infinite;
        }

        .celebration.show {
            display: flex;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .celebration-content {
            text-align: center;
        }

        .celebration-emoji {
            font-size: 6em;
            margin-bottom: 20px;
            animation: bounce 0.5s ease-in-out infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .celebration-text {
            font-size: 4em;
            color: #ff1493;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
        }

        .word-display {
            text-align: center;
            margin-bottom: 50px;
        }

        .word-emoji {
            font-size: 10em;
            margin-bottom: 25px;
            display: inline-block;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-15px); }
        }

        .word-text {
            font-size: 6em;
            color: #ff1493;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .question {
            font-size: 2.2em;
            color: #555;
            font-weight: bold;
        }

        .answer-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 40px;
        }

        .answer-btn {
            background: linear-gradient(135deg, #ff6b9d 0%, #c06bff 100%);
            color: white;
            border: none;
            font-size: 3.5em;
            font-weight: bold;
            padding: 50px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(255, 107, 157, 0.4);
            transition: all 0.3s;
            border: 5px solid transparent;
        }

        .answer-btn:hover:not(:disabled) {
            transform: scale(1.1);
            box-shadow: 0 8px 25px rgba(255, 107, 157, 0.6);
        }

        .answer-btn:active:not(:disabled) {
            transform: scale(0.95);
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        .answer-btn.correct {
            background: linear-gradient(135deg, #00e676 0%, #00c853 100%);
            border-color: #fff;
            animation: correctPulse 0.5s ease-in-out;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.15); }
        }

        .answer-btn.incorrect {
            background: linear-gradient(135deg, #ff5252 0%, #ff1744 100%);
            animation: shake 0.5s ease-in-out;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .answer-btn.neutral {
            background: #bbb;
            opacity: 0.5;
        }

        .feedback {
            text-align: center;
            margin-bottom: 35px;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .feedback-text {
            font-size: 2.5em;
            font-weight: bold;
            padding: 15px 30px;
            border-radius: 20px;
        }

        .feedback-correct {
            color: #00c853;
            background: rgba(0, 230, 118, 0.1);
        }

        .feedback-incorrect {
            color: #ff1744;
            background: rgba(255, 23, 68, 0.1);
        }

        .next-btn {
            background: linear-gradient(135deg, #00e676 0%, #00b0ff 100%);
            color: white;
            border: none;
            font-size: 2.5em;
            font-weight: bold;
            padding: 25px 60px;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(0, 230, 118, 0.4);
            transition: all 0.3s;
            display: block;
            margin: 0 auto;
        }

        .next-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 25px rgba(0, 230, 118, 0.6);
        }

        .reset-btn {
            background: rgba(255,255,255,0.3);
            backdrop-filter: blur(10px);
            color: white;
            border: none;
            font-size: 1.5em;
            font-weight: bold;
            padding: 18px 45px;
            border-radius: 30px;
            cursor: pointer;
            display: block;
            margin: 35px auto 0;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .reset-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: scale(1.05);
        }

        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .star {
            position: absolute;
            font-size: 2em;
            animation: fall 2s linear forwards;
            opacity: 0;
        }

        @keyframes fall {
            0% { 
                transform: translateY(0) rotate(0deg);
                opacity: 1;
            }
            100% { 
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 { font-size: 2.2em; }
            .word-emoji { font-size: 6em; }
            .word-text { font-size: 3.5em; }
            .question { font-size: 1.6em; }
            .answer-btn { font-size: 2.5em; padding: 30px; }
            .answer-grid { grid-template-columns: repeat(2, 1fr); }
            .score-item { font-size: 1.3em; padding: 10px 20px; }
        }
    </style>
</head>
<body>
    <div class="stars" id="stars"></div>
    
    <div class="container">
        <div class="header">
            <h1>🌟 Колко са звуковете? 🌟</h1>
            <div class="score-board">
                <div class="score-item">⭐ Точки: <span id="score">0</span></div>
                <div class="score-item">📝 Въпрос: <span id="current">1</span> / <span id="total">30</span></div>
            </div>
        </div>

        <div class="game-card">
            <div class="celebration" id="celebration">
                <div class="celebration-content">
                    <div class="celebration-emoji">🎉🎊🎈</div>
                    <div class="celebration-text">БРАВО!</div>
                </div>
            </div>

            <div class="word-display">
                <div class="word-emoji" id="wordEmoji">🐴</div>
                <div class="word-text" id="wordText">КОН</div>
                <div class="question">Колко звука има в тази дума?</div>
            </div>

            <div class="answer-grid" id="answerGrid"></div>

            <div class="feedback" id="feedback"></div>

            <div id="nextButtonContainer"></div>
        </div>

        <button class="reset-btn" onclick="resetGame()">🔄 Нова игра</button>
    </div>

    <script>
        const words = [
            { word: 'КОН', sounds: 3, emoji: '🐴' },
            { word: 'СТОЛ', sounds: 4, emoji: '🪑' },
            { word: 'МАСА', sounds: 4, emoji: '🪑' },
            { word: 'УХО', sounds: 3, emoji: '👂' },
            { word: 'ЗАЕК', sounds: 4, emoji: '🐰' },
            { word: 'РИБА', sounds: 4, emoji: '🐟' },
            { word: 'МАМА', sounds: 4, emoji: '👩' },
            { word: 'БАБА', sounds: 4, emoji: '👵' },
            { word: 'КУЧЕ', sounds: 4, emoji: '🐕' },
            { word: 'КОТЕ', sounds: 4, emoji: '🐱' },
            { word: 'МАК', sounds: 3, emoji: '🌺' },
            { word: 'РОЗА', sounds: 4, emoji: '🌹' },
            { word: 'ЛАЛЕ', sounds: 4, emoji: '🌷' },
            { word: 'НОЖ', sounds: 3, emoji: '🔪' },
            { word: 'КОШ', sounds: 3, emoji: '🧺' },
            { word: 'ПИЛЕ', sounds: 4, emoji: '🐤' },
            { word: 'МЕЧКА', sounds: 5, emoji: '🐻' },
            { word: 'ПТИЦА', sounds: 5, emoji: '🐦' },
            { word: 'ТОРТА', sounds: 5, emoji: '🎂' },
            { word: 'КРУША', sounds: 5, emoji: '🍐' },
            { word: 'ТОПКА', sounds: 5, emoji: '⚽' },
            { word: 'КНИГА', sounds: 5, emoji: '📚' },
            { word: 'ЦВЕТЕ', sounds: 5, emoji: '🌸' },
            { word: 'ДЪРВО', sounds: 5, emoji: '🌳' },
            { word: 'СЛЪНЦЕ', sounds: 6, emoji: '☀️' },
            { word: 'ЗВЕЗДА', sounds: 6, emoji: '⭐' },
            { word: 'САМОЛЕТ', sounds: 7, emoji: '✈️' },
            { word: 'ПЕПЕРУДА', sounds: 8, emoji: '🦋' },
            { word: 'ЯБЪЛКА', sounds: 6, emoji: '🍎' },
            { word: 'ДОМАТ', sounds: 5, emoji: '🍅' }
        ];

        let currentIndex = 0;
        let score = 0;
        let answered = false;
        let selectedAnswer = null;

        function init() {
            document.getElementById('total').textContent = words.length;
            displayWord();
        }

        function createStars() {
            const starsContainer = document.getElementById('stars');
            const emojis = ['⭐', '✨', '🌟', '💫'];
            
            for (let i = 0; i < 20; i++) {
                setTimeout(() => {
                    const star = document.createElement('div');
                    star.className = 'star';
                    star.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    star.style.left = Math.random() * 100 + '%';
                    star.style.animationDelay = '0s';
                    starsContainer.appendChild(star);
                    
                    setTimeout(() => star.remove(), 2000);
                }, i * 100);
            }
        }

        function displayWord() {
            const word = words[currentIndex];
            document.getElementById('wordEmoji').textContent = word.emoji;
            document.getElementById('wordText').textContent = word.word;
            document.getElementById('current').textContent = currentIndex + 1;
            
            const maxSounds = Math.max(...words.map(w => w.sounds));
            const grid = document.getElementById('answerGrid');
            grid.innerHTML = '';
            
            for (let i = 1; i <= maxSounds; i++) {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = i;
                btn.onclick = () => handleAnswer(i);
                grid.appendChild(btn);
            }
            
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('nextButtonContainer').innerHTML = '';
            answered = false;
            selectedAnswer = null;
        }

        function handleAnswer(answer) {
            if (answered) return;
            
            answered = true;
            selectedAnswer = answer;
            const word = words[currentIndex];
            const buttons = document.querySelectorAll('.answer-btn');
            
            buttons.forEach((btn, index) => {
                const num = index + 1;
                btn.disabled = true;
                
                if (num === word.sounds) {
                    btn.className = 'answer-btn correct';
                } else if (num === selectedAnswer) {
                    btn.className = 'answer-btn incorrect';
                } else {
                    btn.className = 'answer-btn neutral';
                }
            });
            
            const feedback = document.getElementById('feedback');
            if (answer === word.sounds) {
                score++;
                document.getElementById('score').textContent = score;
                feedback.innerHTML = '<div class="feedback-text feedback-correct">⭐ Чудесно! Браво! ⭐</div>';
                
                const celebration = document.getElementById('celebration');
                celebration.classList.add('show');
                setTimeout(() => celebration.classList.remove('show'), 1500);
                
                createStars();
            } else {
                feedback.innerHTML = `<div class="feedback-text feedback-incorrect">💭 Правилният отговор е ${word.sounds} звука</div>`;
            }
            
            const nextContainer = document.getElementById('nextButtonContainer');
            const nextBtn = document.createElement('button');
            nextBtn.className = 'next-btn';
            nextBtn.textContent = currentIndex < words.length - 1 ? 'Следваща дума →' : 'Завърши играта 🎉';
            nextBtn.onclick = nextWord;
            nextContainer.appendChild(nextBtn);
        }

        function nextWord() {
            if (currentIndex < words.length - 1) {
                currentIndex++;
                displayWord();
            } else {
                currentIndex = 0;
                displayWord();
            }
        }

        function resetGame() {
            currentIndex = 0;
            score = 0;
            document.getElementById('score').textContent = 0;
            displayWord();
        }

        init();
    </script>
</body>
</html>
