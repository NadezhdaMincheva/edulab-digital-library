<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Безопасност на движението</title>
<style>
  :root{
    --veh-a:#4361ee; --veh-b:#90e0ef;
    --sign-a:#e63946; --sign-b:#ffb703;
    --bg-a:#48cae4; --bg-b:#ffd166;
    --panel:#ffffff;
    --text-dark:#2b2b3a;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    font-family:'Trebuchet MS','Segoe UI',Verdana,sans-serif;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
  }
  body{
    background:linear-gradient(135deg,var(--bg-a),var(--bg-b));
    transition:background 1s ease;
  }
  #app{ position:relative; width:100vw; height:100vh; overflow:hidden; }
  .screen{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transform:scale(0.92);
    transition:opacity .5s ease, transform .5s ease;
    padding:20px; text-align:center;
  }
  .screen.active{ opacity:1; pointer-events:auto; transform:scale(1); }
  .bg-particles{ position:absolute; inset:0; overflow:hidden; pointer-events:none; z-index:0; }
  .particle{
    position:absolute; top:-10%; font-size:2.4rem;
    will-change:transform;
    animation-name:fall; animation-timing-function:linear;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,.15));
  }
  @keyframes fall{
    from{ transform:translateY(0) rotate(0deg); }
    to{ transform:translateY(115vh) rotate(360deg); }
  }
  h1{
    font-size:clamp(1.9rem,5.5vw,3.4rem);
    color:var(--text-dark);
    text-shadow:0 3px 0 rgba(255,255,255,.6);
    margin:0 0 10px; z-index:2;
  }
  h2{ font-size:clamp(1.5rem,4.5vw,2.4rem); color:var(--text-dark); margin:0 0 4px; z-index:2; }
  p{ font-size:clamp(1rem,2.4vw,1.4rem); color:var(--text-dark); z-index:2; margin:4px 0 18px; }
  .big-button{
    font-size:clamp(1.4rem,3.4vw,2.2rem); font-weight:800;
    padding:22px 54px; border:none; border-radius:60px;
    background:linear-gradient(135deg,#ff8a65,#ff5e62); color:#fff; cursor:pointer;
    box-shadow:0 10px 0 #c43e3e, 0 16px 24px rgba(0,0,0,.25);
    transition:transform .12s, box-shadow .12s; z-index:2;
    animation:idle-bob 2.4s ease-in-out infinite;
  }
  .big-button:active{ transform:translateY(8px); box-shadow:0 2px 0 #c43e3e,0 6px 12px rgba(0,0,0,.2); }
  @keyframes idle-bob{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-10px); } }
  .title-emojis{ font-size:clamp(2.6rem,7vw,4rem); z-index:2; margin-bottom:6px; }

  /* ROAD animation on start screen */
  .road-strip{
    position:absolute; bottom:0; left:0; right:0; height:90px;
    background:linear-gradient(180deg,#555,#333);
    z-index:1; overflow:hidden;
  }
  .road-strip::before{
    content:"";
    position:absolute; top:50%; left:-120%; right:-10%;
    height:8px; background:repeating-linear-gradient(90deg,#fff 0,#fff 60px,transparent 60px,transparent 120px);
    transform:translateY(-50%);
    animation:road-scroll 1.8s linear infinite;
  }
  @keyframes road-scroll{ to{ left:0; } }
  .road-car{
    position:absolute; bottom:20px; font-size:2.4rem;
    animation:drive 5s linear infinite;
  }
  @keyframes drive{ from{left:-10%} to{left:110%} }

  /* MAP */
  .category-bubbles{
    display:grid; grid-template-columns:repeat(2,1fr);
    gap:clamp(24px,6vw,60px); z-index:2; margin-top:10px;
  }
  .category-bubble{
    position:relative;
    width:clamp(155px,25vw,235px); height:clamp(155px,25vw,235px);
    border-radius:50%; border:none; cursor:pointer;
    font-size:clamp(1rem,2.4vw,1.4rem); font-weight:800; color:#fff;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    box-shadow:0 10px 0 rgba(0,0,0,.18),0 16px 26px rgba(0,0,0,.22);
    animation:idle-bob 3s ease-in-out infinite;
  }
  .category-bubble:nth-child(2){ animation-delay:.4s; }
  .category-bubble .emo{ font-size:clamp(2.8rem,7vw,4.2rem); margin-bottom:4px; }
  .category-bubble:active{ transform:scale(.93); }
  .category-bubble.vehicles{ background:radial-gradient(circle at 30% 30%,var(--veh-b),var(--veh-a)); }
  .category-bubble.signs{ background:radial-gradient(circle at 30% 30%,var(--sign-b),var(--sign-a)); }
  .category-bubble .check{
    position:absolute; top:-6px; right:-6px;
    background:#3ddc84; color:#fff; border-radius:50%;
    width:42px; height:42px; display:flex; align-items:center; justify-content:center;
    font-size:1.5rem; box-shadow:0 4px 8px rgba(0,0,0,.25);
    transform:scale(0); transition:transform .3s;
  }
  .category-bubble.done .check{ transform:scale(1); }

  /* GAME */
  .round-indicator{
    font-size:clamp(1rem,2.2vw,1.3rem); color:var(--text-dark);
    z-index:2; margin-bottom:6px; font-weight:700; opacity:.8;
  }
  .progress-stars{
    font-size:clamp(1.6rem,3.4vw,2.2rem);
    margin-bottom:10px; z-index:2; letter-spacing:6px;
  }
  #items-grid{
    display:grid; grid-template-columns:repeat(3,1fr);
    gap:clamp(14px,3vw,28px); z-index:2; transition:opacity .25s;
  }
  .item-btn{
    width:clamp(95px,17vw,160px); height:clamp(95px,17vw,160px);
    border-radius:28px; border:none; background:var(--panel);
    font-size:clamp(2.4rem,6vw,4rem);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    box-shadow:0 8px 0 rgba(0,0,0,.15),0 12px 18px rgba(0,0,0,.18);
    position:relative; transition:transform .12s;
  }
  .item-btn:active{ transform:scale(.92); }
  .item-btn.shake{ animation:shake .45s ease; }
  @keyframes shake{
    0%,100%{ transform:translateX(0); }
    20%{ transform:translateX(-10px) rotate(-4deg); }
    40%{ transform:translateX(10px) rotate(4deg); }
    60%{ transform:translateX(-8px) rotate(-3deg); }
    80%{ transform:translateX(8px) rotate(3deg); }
  }
  .item-btn.found{
    background:linear-gradient(135deg,#bdf5c8,#7fe89c);
    pointer-events:none; animation:pop .4s ease;
  }
  .item-btn.found::after{
    content:"⭐"; position:absolute; top:-14px; right:-10px;
    font-size:2rem; animation:pop .4s ease;
  }
  @keyframes pop{
    0%{ transform:scale(0.6); } 60%{ transform:scale(1.15); } 100%{ transform:scale(1); }
  }
  .round-banner{
    position:absolute; top:38%; left:50%;
    transform:translate(-50%,-50%) scale(0.6);
    font-size:clamp(2rem,6vw,3.2rem); font-weight:800;
    color:#fff; text-shadow:0 4px 10px rgba(0,0,0,.35);
    background:rgba(255,255,255,.18);
    padding:14px 36px; border-radius:30px;
    opacity:0; pointer-events:none; z-index:10;
    transition:opacity .25s,transform .25s;
  }
  .round-banner.show{ opacity:1; transform:translate(-50%,-50%) scale(1); }

  .back-btn{
    position:absolute; top:18px; left:18px;
    background:rgba(255,255,255,.85); border:none; border-radius:50%;
    width:54px; height:54px; font-size:1.6rem; cursor:pointer; z-index:5;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .sound-btn{
    position:absolute; top:18px; right:18px;
    background:rgba(255,255,255,.85); border:none; border-radius:50%;
    width:54px; height:54px; font-size:1.5rem; cursor:pointer; z-index:5;
    box-shadow:0 4px 10px rgba(0,0,0,.2);
  }
  .trophy{ font-size:clamp(4rem,12vw,7rem); animation:idle-bob 1.6s ease-in-out infinite; z-index:2; }

  /* CONFETTI */
  .confetti-layer{ position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden; }
  .confetti-piece{
    position:absolute; top:0; left:0; width:12px; height:12px; opacity:.95;
    animation-name:confetti-fall; animation-timing-function:cubic-bezier(.2,.6,.3,1); animation-fill-mode:forwards;
  }
  @keyframes confetti-fall{ to{ transform:translate(var(--dx),var(--dy)) rotate(var(--rot)); opacity:0; } }

  /* fun info bar */
  .fun-fact{
    font-size:clamp(.9rem,2vw,1.15rem);
    color:var(--text-dark); z-index:2;
    background:rgba(255,255,255,.55);
    padding:8px 20px; border-radius:20px;
    margin-bottom:10px;
    max-width:520px;
  }
</style>
</head>
<body>
<div id="app">

  <button class="sound-btn" id="soundToggle">🔊</button>

  <!-- START SCREEN -->
  <div class="screen active" id="screen-start">
    <div class="bg-particles" id="bg-start"></div>
    <div class="road-strip">
      <span class="road-car" style="animation-delay:0s">🚗</span>
      <span class="road-car" style="animation-delay:2s;font-size:2rem">🚌</span>
      <span class="road-car" style="animation-delay:3.5s;font-size:1.8rem">🚑</span>
    </div>
    <div class="title-emojis">🚦🚗🛑🚒</div>
    <h1>Безопасност на<br>движението</h1>
    <p>Научи пътните знаци и превозните средства!</p>
    <button class="big-button" id="btnStart">▶️ Старт</button>
  </div>

  <!-- MAP SCREEN -->
  <div class="screen" id="screen-map">
    <div class="bg-particles" id="bg-map"></div>
    <h2>Избери тема 🛣️</h2>
    <p>Докосни кръгчето, за да започнеш</p>
    <div class="category-bubbles" id="categoryBubbles"></div>
  </div>

  <!-- GAME SCREEN -->
  <div class="screen" id="screen-game">
    <button class="back-btn" id="btnBackMap">⬅️</button>
    <div class="bg-particles" id="bg-game"></div>
    <div class="round-banner" id="roundBanner">🎉 Браво!</div>
    <h2 id="gameTitle"></h2>
    <div class="round-indicator" id="roundIndicator"></div>
    <div class="fun-fact" id="funFact"></div>
    <div class="progress-stars" id="progressStars"></div>
    <div id="items-grid"></div>
  </div>

  <!-- CATEGORY COMPLETE -->
  <div class="screen" id="screen-category-complete">
    <div class="bg-particles" id="bg-complete"></div>
    <div class="trophy">🎉</div>
    <h1 id="completeTitle">Браво!</h1>
    <p id="completeMsg">Ти знаеш много за пътната безопасност!</p>
    <button class="big-button" id="btnToMap">Продължи ➡️</button>
  </div>

  <!-- FINAL SCREEN -->
  <div class="screen" id="screen-final">
    <div class="bg-particles" id="bg-final"></div>
    <div class="trophy">🏆</div>
    <h1>Поздравления!</h1>
    <p>Ти си истински шампион по пътна безопасност!</p>
    <button class="big-button" id="btnRestart">🔁 Играй пак</button>
  </div>

</div>

<script>
(function(){
  "use strict";

  // ---------- DATA ----------
  // vehicles: 30 items → 10 rounds x 3
  // signs & safety: 24 items → 8 rounds x 3  →  TOTAL 18 rounds
  const CATEGORIES = {
    vehicles:{
      name:"Превозни средства", emo:"🚗", cls:"vehicles",
      bg:"linear-gradient(135deg,#90e0ef,#4361ee)",
      particles:["🚗","🚌","🚒","🚑","✈️"],
      correct:[
        "🚗","🚕","🚙","🚌","🚑","🚒","🚓","🚐","🚚","🚛",
        "🚜","🏎️","🚲","🛵","🏍️","🛻","🚞","🚂","✈️","🚁",
        "⛵","🛺","🛴","🛳️","🚀","🛸","🚠","🛥️","🛶","🚡"
      ],
      funFacts:[
        "🚑 Линейката помага на болните хора!",
        "🚒 Пожарната кола гаси пожари!",
        "🚓 Полицейската кола пази реда!",
        "✈️ Самолетът лети много високо!",
        "🚂 Влакът се движи по релси!",
        "🚁 Хеликоптерът може да лети нагоре!",
        "🚜 Тракторът работи в полето!",
        "🚲 Велосипедът е много полезен и здравословен!",
        "⛵ Ладията плава по водата!",
        "🛻 Пикапът може да носи много товар!"
      ]
    },
    signs:{
      name:"Пътни знаци и правила", emo:"🚦", cls:"signs",
      bg:"linear-gradient(135deg,#ffb703,#e63946)",
      particles:["🚦","🛑","⚠️","🚸"],
      correct:[
        "🚦","🛑","⚠️","🚸","🦺","⛑️","🔦","🚨","🔰","🚧",
        "🛞","🚥","🏁","🚏","🪧","🗺️","🧭","🧰","🪜","🧯",
        "🔑","🪝","🛂","🛡️"
      ],
      funFacts:[
        "🚦 Червено – стой! Зелено – върви!",
        "🛑 СТОП знакът означава – спри!",
        "⚠️ Жълтият триъгълник предупреждава за опасност!",
        "🚸 Този знак пази децата на пътя!",
        "🦺 Жилетката те прави видим в тъмното!",
        "⛑️ Каската пазе главата ни!",
        "🔦 Фенерчето ни помага да бъдем видени!",
        "🚨 Мигалките означават спешна помощ!",
        "🔰 Зеленият знак означава нов шофьор!"
      ]
    }
  };
  const CATEGORY_ORDER = ["vehicles","signs"];
  function opposite(k){ return k==="vehicles"?"signs":"vehicles"; }
  function chunk3(arr){ const o=[]; for(let i=0;i<arr.length;i+=3) o.push(arr.slice(i,i+3)); return o; }
  function sample(arr,n){ return arr.slice().sort(()=>Math.random()-.5).slice(0,n); }

  // ---------- STATE ----------
  let st = {
    completed:new Set(), currentCat:null, roundIdx:0,
    rounds:[], found:new Set(), items:[], soundOn:true
  };

  // ---------- SCREENS ----------
  const SCR={};
  document.querySelectorAll(".screen").forEach(s=>SCR[s.id]=s);
  function show(id){ Object.values(SCR).forEach(s=>s.classList.remove("active")); SCR[id].classList.add("active"); }

  // ---------- PARTICLES ----------
  let bgIv={};
  function stopPart(k){ if(bgIv[k]){ clearInterval(bgIv[k]); bgIv[k]=null; } }
  function stopAll(){ Object.keys(bgIv).forEach(stopPart); }
  function spawnPart(cid, emojis, k){
    stopPart(k);
    const c=document.getElementById(cid); if(!c) return;
    bgIv[k]=setInterval(()=>{
      const p=document.createElement("div");
      p.className="particle";
      p.textContent=emojis[Math.floor(Math.random()*emojis.length)];
      p.style.left=(Math.random()*92)+"%";
      const d=5+Math.random()*5; p.style.animationDuration=d+"s";
      p.style.fontSize=(1.6+Math.random()*1.8)+"rem";
      c.appendChild(p); setTimeout(()=>p.remove(),d*1000+200);
    },550);
  }
  const MIX=["🚦","🚗","🛑","🚒","⭐","🌈","🚸","⚠️"];

  // ---------- AUDIO ----------
  let ctx=null;
  function ensureAudio(){ if(!ctx) try{ ctx=new(window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  function tone(freq,start,dur,type,g){
    if(!st.soundOn||!ctx) return;
    const o=ctx.createOscillator(), gn=ctx.createGain();
    o.type=type||"sine"; o.frequency.value=freq;
    gn.gain.value=0; o.connect(gn); gn.connect(ctx.destination);
    const t=ctx.currentTime+start;
    gn.gain.linearRampToValueAtTime(g||.15,t+.02);
    gn.gain.linearRampToValueAtTime(0,t+dur);
    o.start(t); o.stop(t+dur+.02);
  }
  function playOk(){
    tone(523.25,0,.16,"triangle",.18);
    tone(659.25,.1,.16,"triangle",.18);
    tone(783.99,.2,.22,"triangle",.2);
  }
  function playNo(){
    tone(220,0,.16,"sine",.12);
    tone(196,.08,.2,"sine",.1);
  }
  function playCelebrate(){
    [523.25,587.33,659.25,698.46,783.99,880].forEach((f,i)=>tone(f,i*.1,.28,"triangle",.18));
  }
  function playStartJingle(){
    [392,523.25,659.25,783.99].forEach((f,i)=>tone(f,i*.12,.3,"triangle",.15));
  }

  // ---------- CONFETTI ----------
  const COLS=["#ff6b6b","#ffd93d","#6bcb77","#4d96ff","#ff8fab","#c77dff"];
  function burst(x,y,n){
    const l=document.createElement("div"); l.className="confetti-layer"; document.body.appendChild(l);
    for(let i=0;i<(n||26);i++){
      const p=document.createElement("div"); p.className="confetti-piece";
      p.style.left=x+"px"; p.style.top=y+"px";
      p.style.background=COLS[Math.floor(Math.random()*COLS.length)];
      p.style.borderRadius=Math.random()>.5?"50%":"3px";
      const a=Math.random()*Math.PI*2, d=80+Math.random()*180;
      p.style.setProperty("--dx",Math.cos(a)*d+"px");
      p.style.setProperty("--dy",Math.sin(a)*d+140+"px");
      p.style.setProperty("--rot",(Math.random()*720-360)+"deg");
      p.style.animationDuration=(.9+Math.random()*.6)+"s";
      l.appendChild(p);
    }
    setTimeout(()=>l.remove(),1700);
  }
  function bigBurst(){
    const w=window.innerWidth; let n=0;
    const iv=setInterval(()=>{ burst(Math.random()*w,0,30); if(++n>6) clearInterval(iv); },350);
  }
  function smallBurst(){ const w=window.innerWidth; burst(w*.3,60,24); burst(w*.7,60,24); }

  // ---------- MAP ----------
  function buildMap(){
    const wrap=document.getElementById("categoryBubbles"); wrap.innerHTML="";
    CATEGORY_ORDER.forEach(k=>{
      const c=CATEGORIES[k];
      const btn=document.createElement("button");
      btn.className="category-bubble "+c.cls+(st.completed.has(k)?" done":"");
      btn.innerHTML=`<span class="emo">${c.emo}</span>${c.name}<span class="check">✓</span>`;
      btn.addEventListener("click",()=>startCat(k));
      wrap.appendChild(btn);
    });
  }

  // ---------- GAME ----------
  function startCat(k){
    st.currentCat=k; st.roundIdx=0;
    st.rounds=chunk3(CATEGORIES[k].correct);
    const c=CATEGORIES[k];
    document.body.style.background=c.bg;
    document.getElementById("gameTitle").textContent=c.emo+" "+c.name;
    spawnPart("bg-game",c.particles,"game");
    loadRound(); show("screen-game");
  }

  function loadRound(){
    const k=st.currentCat, c=CATEGORIES[k];
    const correct=st.rounds[st.roundIdx];
    const distract=sample(CATEGORIES[opposite(k)].correct,3);
    let items=correct.map(e=>({emo:e,ok:true})).concat(distract.map(e=>({emo:e,ok:false})));
    items=items.sort(()=>Math.random()-.5);
    st.found=new Set(); st.items=items;

    document.getElementById("roundIndicator").textContent=
      "Рунд "+(st.roundIdx+1)+" от "+st.rounds.length;

    // fun fact
    const facts=c.funFacts;
    document.getElementById("funFact").textContent=facts[st.roundIdx%facts.length];

    renderItems(); updateStars();
  }

  function renderItems(){
    const g=document.getElementById("items-grid");
    g.style.opacity=0;
    setTimeout(()=>{
      g.innerHTML="";
      st.items.forEach((item,idx)=>{
        const b=document.createElement("button");
        b.className="item-btn"; b.textContent=item.emo; b.dataset.idx=idx;
        b.addEventListener("click",()=>onClick(idx,b));
        g.appendChild(b);
      });
      g.style.opacity=1;
    },180);
  }

  function updateStars(){
    const tot=st.rounds[st.roundIdx].length;
    document.getElementById("progressStars").textContent=
      Array.from({length:tot},(_,i)=>i<st.found.size?"⭐":"☆").join("");
  }

  function onClick(idx,btn){
    const item=st.items[idx];
    if(btn.classList.contains("found")) return;
    if(item.ok){
      btn.classList.add("found"); st.found.add(idx);
      playOk();
      const r=btn.getBoundingClientRect();
      burst(r.left+r.width/2, r.top+r.height/2, 22);
      updateStars();
      if(st.found.size>=st.rounds[st.roundIdx].length) setTimeout(roundDone,650);
    } else {
      btn.classList.remove("shake"); void btn.offsetWidth;
      btn.classList.add("shake"); playNo();
    }
  }

  function roundDone(){
    if(st.roundIdx<st.rounds.length-1){
      const ban=document.getElementById("roundBanner");
      ban.textContent="🎉 Чудесно!"; ban.classList.add("show");
      smallBurst(); playCelebrate();
      setTimeout(()=>{ ban.classList.remove("show"); st.roundIdx++; loadRound(); },1300);
    } else {
      finishCat();
    }
  }

  function finishCat(){
    stopAll(); const k=st.currentCat;
    st.completed.add(k);
    const c=CATEGORIES[k];
    document.getElementById("completeTitle").textContent="Браво! "+c.emo;
    const msgs={
      vehicles:"Ти познаваш всички превозни средства! 🚗",
      signs:"Ти знаеш всички пътни знаци и правила! 🚦"
    };
    document.getElementById("completeMsg").textContent=msgs[k];
    spawnPart("bg-complete",MIX,"complete");
    show("screen-category-complete");
    smallBurst(); playCelebrate();
    if(st.completed.size>=CATEGORY_ORDER.length){
      setTimeout(()=>{ stopAll(); spawnPart("bg-final",MIX,"final"); show("screen-final"); bigBurst(); playCelebrate(); },1800);
    }
  }

  // ---------- NAVIGATION ----------
  document.getElementById("btnStart").addEventListener("click",()=>{
    ensureAudio(); playStartJingle();
    stopAll(); buildMap();
    document.body.style.background="linear-gradient(135deg,var(--bg-a),var(--bg-b))";
    spawnPart("bg-map",MIX,"map"); show("screen-map");
  });
  document.getElementById("btnBackMap").addEventListener("click",()=>{
    stopAll();
    document.body.style.background="linear-gradient(135deg,var(--bg-a),var(--bg-b))";
    buildMap(); spawnPart("bg-map",MIX,"map"); show("screen-map");
  });
  document.getElementById("btnToMap").addEventListener("click",()=>{
    stopAll();
    document.body.style.background="linear-gradient(135deg,var(--bg-a),var(--bg-b))";
    buildMap(); spawnPart("bg-map",MIX,"map"); show("screen-map");
  });
  document.getElementById("btnRestart").addEventListener("click",()=>{
    st.completed=new Set(); st.currentCat=null; st.roundIdx=0; st.found=new Set();
    stopAll();
    document.body.style.background="linear-gradient(135deg,var(--bg-a),var(--bg-b))";
    spawnPart("bg-start",MIX,"start"); show("screen-start");
  });
  document.getElementById("soundToggle").addEventListener("click",function(){
    st.soundOn=!st.soundOn; this.textContent=st.soundOn?"🔊":"🔇";
  });

  spawnPart("bg-start",MIX,"start");
})();
</script>
</body>
</html>
