<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Домашни Животни - Образователна игра</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(135deg, #56ab2f 0%, #a8e063 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .game-container {
            background: white;
            border-radius: 30px;
            padding: 40px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            text-align: center;
            color: #56ab2f;
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
        }

        .score {
            text-align: center;
            font-size: 1.8em;
            color: #6a994e;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .animal-display {
            background: linear-gradient(135deg, #fff4e6 0%, #ffe8cc 100%);
            border-radius: 20px;
            padding: 50px;
            margin-bottom: 40px;
            text-align: center;
            min-height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .animal-emoji {
            font-size: 150px;
            margin-bottom: 20px;
            animation: bounceIn 0.8s ease;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .question {
            font-size: 2em;
            color: #6a994e;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .animal-sound {
            font-size: 2.5em;
            color: #bc4749;
            font-weight: bold;
            margin-top: 20px;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .answers {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .answer-btn {
            background: linear-gradient(135deg, #ffeaa7 0%, #fdcb6e 100%);
            border: 4px solid #e17055;
            border-radius: 20px;
            padding: 30px 20px;
            font-size: 1.8em;
            font-weight: bold;
            color: #2d3436;
            cursor: pointer;
            transition: all 0.3s;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .answer-btn:hover {
            transform: translateY(-5px) scale(1.05);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
            background: linear-gradient(135deg, #fdcb6e 0%, #ffeaa7 100%);
        }

        .answer-btn:active {
            transform: translateY(-2px) scale(1.02);
        }

        .answer-emoji {
            font-size: 50px;
        }

        .feedback {
            text-align: center;
            font-size: 2.5em;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .correct {
            color: #00b894;
            animation: bounce 0.6s;
        }

        .incorrect {
            color: #e84393;
            animation: shake 0.5s;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .btn-new {
            background: linear-gradient(135deg, #74b9ff, #0984e3);
            color: white;
            font-size: 1.5em;
            padding: 15px 40px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
            display: block;
            margin: 0 auto;
        }

        .btn-new:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(0,0,0,0.3);
        }

        .stars {
            position: absolute;
            font-size: 40px;
            animation: starFloat 1.5s ease-out forwards;
            pointer-events: none;
        }

        @keyframes starFloat {
            0% {
                transform: translateY(0) scale(0) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(-150px) scale(1.5) rotate(360deg);
                opacity: 0;
            }
        }

        .hidden {
            display: none;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 2em;
            }
            
            .animal-emoji {
                font-size: 100px;
            }
            
            .answer-btn {
                font-size: 1.4em;
                padding: 20px 15px;
            }
            
            .answer-emoji {
                font-size: 40px;
            }
            
            .feedback {
                font-size: 1.8em;
            }

            .question {
                font-size: 1.5em;
            }

            .animal-sound {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🐮 Домашни Животни 🐶</h1>
        <div class="score">Правилни отговори: <span id="score">0</span></div>
        
        <div class="animal-display" id="animalDisplay">
            <div class="animal-emoji" id="animalEmoji"></div>
            <div class="question">Кое животно е това?</div>
            <div class="animal-sound hidden" id="animalSound"></div>
        </div>
        
        <div class="answers" id="answersContainer"></div>
        
        <div class="feedback" id="feedback"></div>
        
        <button class="btn-new" onclick="newGame()">🔄 Нова игра</button>
    </div>

    <script>
        const animals = [
            { name: 'Куче', emoji: '🐕', sound: 'БАУ-БАУ!' },
            { name: 'Котка', emoji: '🐱', sound: 'МЯУ-МЯУ!' },
            { name: 'Крава', emoji: '🐄', sound: 'МУУ-МУУ!' },
            { name: 'Овца', emoji: '🐑', sound: 'БЕЕ-БЕЕ!' },
            { name: 'Кокошка', emoji: '🐔', sound: 'КУД-КУД-КУД!' },
            { name: 'Прасе', emoji: '🐷', sound: 'ХРУ-ХРУ!' },
            { name: 'Кон', emoji: '🐴', sound: 'ИХА-ХА!' },
            { name: 'Патица', emoji: '🦆', sound: 'КРАЙ-КРАЙ!' }
        ];

        let currentAnimal = null;
        let score = 0;
        let usedAnimals = [];

        function shuffle(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

        function generateQuestion() {
            const feedback = document.getElementById('feedback');
            const soundEl = document.getElementById('animalSound');
            feedback.innerHTML = '';
            soundEl.classList.add('hidden');

            const availableAnimals = animals.filter(a => !usedAnimals.includes(a.name));
            
            if (availableAnimals.length === 0) {
                usedAnimals = [];
            }

            const animalsToUse = availableAnimals.length > 0 ? availableAnimals : animals;
            currentAnimal = animalsToUse[Math.floor(Math.random() * animalsToUse.length)];
            usedAnimals.push(currentAnimal.name);

            document.getElementById('animalEmoji').textContent = currentAnimal.emoji;

            let options = [currentAnimal];
            while (options.length < 3) {
                const randomAnimal = animals[Math.floor(Math.random() * animals.length)];
                if (!options.includes(randomAnimal)) {
                    options.push(randomAnimal);
                }
            }

            options = shuffle(options);

            const container = document.getElementById('answersContainer');
            container.innerHTML = '';

            options.forEach(animal => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.innerHTML = `
                    <span class="answer-emoji">${animal.emoji}</span>
                    <span>${animal.name}</span>
                `;
                btn.onclick = () => checkAnswer(animal);
                container.appendChild(btn);
            });
        }

        function createStars() {
            const display = document.getElementById('animalDisplay');
            const rect = display.getBoundingClientRect();
            
            for (let i = 0; i < 8; i++) {
                const star = document.createElement('div');
                star.className = 'stars';
                star.textContent = ['⭐', '🌟', '✨'][Math.floor(Math.random() * 3)];
                star.style.left = (Math.random() * rect.width) + 'px';
                star.style.top = (Math.random() * rect.height) + 'px';
                display.appendChild(star);
                
                setTimeout(() => star.remove(), 1500);
            }
        }

        function checkAnswer(selectedAnimal) {
            const feedback = document.getElementById('feedback');
            const soundEl = document.getElementById('animalSound');
            
            if (selectedAnimal.name === currentAnimal.name) {
                score++;
                document.getElementById('score').textContent = score;
                feedback.className = 'feedback correct';
                feedback.textContent = '🎉 Браво! Точно така! 🌟';
                
                soundEl.textContent = currentAnimal.sound;
                soundEl.classList.remove('hidden');
                
                createStars();
                
                setTimeout(() => {
                    generateQuestion();
                }, 2500);
            } else {
                feedback.className = 'feedback incorrect';
                feedback.textContent = '💝 Опитай пак! Можеш! 💪';
                
                setTimeout(() => {
                    feedback.innerHTML = '';
                }, 2000);
            }
        }

        function newGame() {
            score = 0;
            usedAnimals = [];
            document.getElementById('score').textContent = score;
            generateQuestion();
        }

        generateQuestion();
    </script>
</body>
</html>
