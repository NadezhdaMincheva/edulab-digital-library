<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Огънят - приятел и враг</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            background: linear-gradient(to bottom, #fed7aa, #fca5a5);
        }

        .screen {
            display: none;
            min-height: 100vh;
            padding: 2rem;
            align-items: center;
            justify-content: center;
        }

        .screen.active {
            display: flex;
        }

        .intro-content {
            background: white;
            border-radius: 3rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            padding: 4rem;
            max-width: 900px;
            text-align: center;
        }

        .fire-emoji {
            font-size: 10rem;
            display: block;
            margin-bottom: 2rem;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-30px); }
        }

        h1 {
            font-size: 4rem;
            color: #dc2626;
            margin-bottom: 2rem;
        }

        .big-btn {
            font-size: 3rem;
            font-weight: bold;
            padding: 2rem 4rem;
            border: none;
            border-radius: 3rem;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
            margin: 1rem;
        }

        .big-btn:hover {
            transform: scale(1.1);
        }

        .btn-orange {
            background: #f97316;
            color: white;
        }

        .btn-orange:hover {
            background: #ea580c;
        }

        .btn-red {
            background: #ef4444;
            color: white;
        }

        .btn-red:hover {
            background: #dc2626;
        }

        .btn-blue {
            background: #3b82f6;
            color: white;
        }

        .btn-blue:hover {
            background: #2563eb;
        }

        .btn-green {
            background: #22c55e;
            color: white;
        }

        .btn-green:hover {
            background: #16a34a;
        }

        .friend-screen {
            background: linear-gradient(to bottom, #d1fae5, #bfdbfe);
        }

        .danger-screen {
            background: linear-gradient(to bottom, #fecaca, #fed7aa);
        }

        .quiz-screen {
            background: linear-gradient(to bottom, #e9d5ff, #fbcfe8);
        }

        .result-screen {
            background: linear-gradient(to bottom, #fef3c7, #fed7aa);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        h2 {
            font-size: 4rem;
            text-align: center;
            margin-bottom: 3rem;
            color: #15803d;
        }

        .danger-screen h2 {
            color: #991b1b;
        }

        .card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .card {
            background: white;
            border-radius: 2rem;
            padding: 3rem;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            transition: transform 0.3s;
        }

        .card:hover {
            transform: scale(1.08);
        }

        .card-emoji {
            font-size: 8rem;
            margin-bottom: 1.5rem;
        }

        .warning-box {
            background: #fef3c7;
            border: 6px solid #fbbf24;
            border-radius: 2rem;
            padding: 2rem;
            margin-bottom: 3rem;
            text-align: center;
        }

        .warning-text {
            font-size: 3rem;
            font-weight: bold;
            color: #78350f;
        }

        .danger-card {
            border: 6px solid #f87171;
        }

        .quiz-container {
            background: white;
            border-radius: 3rem;
            box-shadow: 0 30px 60px rgba(0,0,0,0.3);
            padding: 3rem;
            max-width: 1200px;
            margin: 0 auto;
        }

        .question-emoji {
            font-size: 10rem;
            text-align: center;
            margin-bottom: 3rem;
        }

        .options-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .option-card {
            background: white;
            border: 6px solid #3b82f6;
            border-radius: 2rem;
            padding: 2rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            position: relative;
        }

        .option-card:hover:not(.disabled) {
            transform: scale(1.08);
            box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
        }

        .option-card.disabled {
            cursor: not-allowed;
        }

        .option-card.correct {
            border-color: #22c55e;
            background: #d1fae5;
            animation: pulse-correct 0.5s;
        }

        .option-card.incorrect {
            border-color: #ef4444;
            background: #fecaca;
            animation: shake 0.5s;
        }

        .option-card.disabled-wrong {
            opacity: 0.4;
            border-color: #d1d5db;
        }

        @keyframes pulse-correct {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-20px); }
            75% { transform: translateX(20px); }
        }

        .option-emoji {
            font-size: 8rem;
            margin-bottom: 1rem;
        }

        .option-label {
            font-size: 2rem;
            font-weight: bold;
            color: #1f2937;
        }

        .check-mark {
            position: absolute;
            top: -20px;
            right: -20px;
            font-size: 5rem;
            display: none;
        }

        .option-card.correct .check-mark.correct-mark,
        .option-card.incorrect .check-mark.wrong-mark {
            display: block;
        }

        .feedback {
            padding: 2rem;
            border-radius: 2rem;
            margin-bottom: 2rem;
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
        }

        .feedback.correct {
            background: #d1fae5;
            border: 6px solid #22c55e;
            color: #15803d;
        }

        .feedback.incorrect {
            background: #fecaca;
            border: 6px solid #ef4444;
            color: #991b1b;
        }

        .result-emoji {
            font-size: 12rem;
            margin-bottom: 2rem;
        }

        .result-title {
            font-size: 5rem;
            color: #f97316;
            margin-bottom: 2rem;
        }

        .badge {
            background: linear-gradient(to right, #fbbf24, #f97316);
            color: white;
            font-size: 3rem;
            font-weight: bold;
            padding: 2rem 4rem;
            border-radius: 3rem;
            margin: 2rem 0;
            display: inline-block;
        }

        .center-btn {
            text-align: center;
        }

        .progress-dots {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .dot {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #d1d5db;
        }

        .dot.active {
            background: #3b82f6;
        }

        .dot.completed {
            background: #22c55e;
        }
    </style>
</head>
<body>
    <div id="intro" class="screen active">
        <div class="intro-content">
            <span class="fire-emoji">&#128293;</span>
            <h1>Огънят</h1>
            <button class="big-btn btn-orange" onclick="showScreen('friend')">&#9658;</button>
        </div>
    </div>

    <div id="friend" class="screen friend-screen">
        <div class="container">
            <h2>&#128522;</h2>
            <div class="card-grid">
                <div class="card">
                    <div class="card-emoji">&#127874;</div>
                </div>
                <div class="card">
                    <div class="card-emoji">&#127859;</div>
                </div>
                <div class="card">
                    <div class="card-emoji">&#127957;</div>
                </div>
            </div>
            <div class="warning-box">
                <p class="warning-text">&#9888;</p>
            </div>
            <div class="center-btn">
                <button class="big-btn btn-red" onclick="showScreen('danger')">&#9658;</button>
            </div>
        </div>
    </div>

    <div id="danger" class="screen danger-screen">
        <div class="container">
            <h2>&#9888;</h2>
            <div class="card-grid">
                <div class="card danger-card">
                    <div class="card-emoji">&#128293;&#10060;</div>
                </div>
                <div class="card danger-card">
                    <div class="card-emoji">&#127968;&#10145;&#127939;</div>
                </div>
                <div class="card danger-card">
                    <div class="card-emoji">&#128241;<br>112</div>
                </div>
                <div class="card danger-card">
                    <div class="card-emoji">&#10060;&#128682;</div>
                </div>
            </div>
            <div class="center-btn">
                <button class="big-btn btn-blue" onclick="startQuiz()">&#127918;</button>
            </div>
        </div>
    </div>

    <div id="quiz" class="screen quiz-screen">
        <div class="container">
            <div class="quiz-container">
                <div class="progress-dots" id="progressDots"></div>
                <div class="question-emoji" id="questionEmoji"></div>
                <div class="options-grid" id="optionsGrid"></div>
                <div id="feedback"></div>
                <div class="center-btn" id="nextBtnContainer"></div>
            </div>
        </div>
    </div>

    <div id="result" class="screen result-screen">
        <div class="intro-content">
            <div class="result-emoji" id="resultEmoji"></div>
            <h2 class="result-title" id="resultTitle"></h2>
            <div class="badge">&#127942; &#128170; &#127942;</div>
            <button class="big-btn btn-green" onclick="resetGame()">&#128260;</button>
        </div>
    </div>

    <script>
        var questions = [
            {
                emoji: "&#127968;&#128293;<br>&#10067;",
                options: [
                    { emoji: "&#127939;&#10145;&#127794;", label: "", correct: true },
                    { emoji: "&#128682;&#128719;", label: "", correct: false },
                    { emoji: "&#128682;&#128717;", label: "", correct: false }
                ]
            },
            {
                emoji: "&#128241;&#10067;",
                options: [
                    { emoji: "123", label: "", correct: false },
                    { emoji: "112", label: "", correct: true },
                    { emoji: "999", label: "", correct: false }
                ]
            },
            {
                emoji: "&#128085;&#128293;<br>&#10067;",
                options: [
                    { emoji: "&#127939;&#128168;", label: "", correct: false },
                    { emoji: "&#129335;&#128260;", label: "", correct: true },
                    { emoji: "&#128167;", label: "", correct: false }
                ]
            },
            {
                emoji: "&#129523;&#10067;",
                options: [
                    { emoji: "&#128101;&#128172;", label: "", correct: true },
                    { emoji: "&#128293;&#128064;", label: "", correct: false },
                    { emoji: "&#128682;&#129523;", label: "", correct: false }
                ]
            }
        ];

        var currentQuestion = 0;
        var score = 0;

        function showScreen(screenId) {
            var screens = document.querySelectorAll('.screen');
            for (var i = 0; i < screens.length; i++) {
                screens[i].classList.remove('active');
            }
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz() {
            currentQuestion = 0;
            score = 0;
            showScreen('quiz');
            displayQuestion();
        }

        function updateProgressDots() {
            var dotsContainer = document.getElementById('progressDots');
            dotsContainer.innerHTML = '';
            
            for (var i = 0; i < questions.length; i++) {
                var dot = document.createElement('div');
                dot.className = 'dot';
                if (i < currentQuestion) {
                    dot.className += ' completed';
                } else if (i === currentQuestion) {
                    dot.className += ' active';
                }
                dotsContainer.appendChild(dot);
            }
        }

        function displayQuestion() {
            updateProgressDots();
            var q = questions[currentQuestion];
            
            document.getElementById('questionEmoji').innerHTML = q.emoji;
            
            var optionsGrid = document.getElementById('optionsGrid');
            optionsGrid.innerHTML = '';
            
            for (var i = 0; i < q.options.length; i++) {
                var card = document.createElement('div');
                card.className = 'option-card';
                card.setAttribute('data-index', i);
                card.onclick = function() {
                    if (!this.classList.contains('disabled')) {
                        selectAnswer(parseInt(this.getAttribute('data-index')));
                    }
                };
                
                var emojiDiv = document.createElement('div');
                emojiDiv.className = 'option-emoji';
                emojiDiv.innerHTML = q.options[i].emoji;
                card.appendChild(emojiDiv);
                
                var checkCorrect = document.createElement('div');
                checkCorrect.className = 'check-mark correct-mark';
                checkCorrect.innerHTML = '&#9989;';
                card.appendChild(checkCorrect);
                
                var checkWrong = document.createElement('div');
                checkWrong.className = 'check-mark wrong-mark';
                checkWrong.innerHTML = '&#10060;';
                card.appendChild(checkWrong);
                
                optionsGrid.appendChild(card);
            }
            
            document.getElementById('feedback').innerHTML = '';
            document.getElementById('nextBtnContainer').innerHTML = '';
        }

        function selectAnswer(selectedIndex) {
            var q = questions[currentQuestion];
            var cards = document.querySelectorAll('.option-card');
            
            for (var i = 0; i < cards.length; i++) {
                cards[i].classList.add('disabled');
                if (q.options[i].correct) {
                    cards[i].classList.add('correct');
                } else if (i === selectedIndex) {
                    cards[i].classList.add('incorrect');
                } else {
                    cards[i].classList.add('disabled-wrong');
                }
            }
            
            if (q.options[selectedIndex].correct) {
                score++;
            }
            
            var feedbackDiv = document.getElementById('feedback');
            feedbackDiv.className = 'feedback ' + (q.options[selectedIndex].correct ? 'correct' : 'incorrect');
            feedbackDiv.innerHTML = q.options[selectedIndex].correct ? '&#128076; &#128522;' : '&#128078; &#128533;';
            
            setTimeout(function() {
                var nextBtnContainer = document.getElementById('nextBtnContainer');
                var nextBtn = document.createElement('button');
                nextBtn.className = 'big-btn btn-blue';
                nextBtn.innerHTML = '&#9658;';
                nextBtn.onclick = nextQuestion;
                nextBtnContainer.appendChild(nextBtn);
            }, 1500);
        }

        function nextQuestion() {
            if (currentQuestion < questions.length - 1) {
                currentQuestion++;
                displayQuestion();
            } else {
                showResult();
            }
        }

        function showResult() {
            var resultEmoji = document.getElementById('resultEmoji');
            var resultTitle = document.getElementById('resultTitle');
            
            if (score === questions.length) {
                resultEmoji.innerHTML = '&#127942;';
                resultTitle.innerHTML = '&#127881;';
            } else if (score >= questions.length / 2) {
                resultEmoji.innerHTML = '&#11088;';
                resultTitle.innerHTML = '&#128079;';
            } else {
                resultEmoji.innerHTML = '&#128170;';
                resultTitle.innerHTML = '&#128077;';
            }
            
            showScreen('result');
        }

        function resetGame() {
            currentQuestion = 0;
            score = 0;
            showScreen('intro');
        }
    </script>
</body>
</html>
