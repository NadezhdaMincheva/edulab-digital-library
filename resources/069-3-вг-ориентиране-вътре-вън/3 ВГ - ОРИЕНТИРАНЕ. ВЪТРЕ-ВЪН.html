<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вътре-Вън: Помогни на животните</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background: linear-gradient(to bottom, #87CEEB 0%, #98D8C8 100%);
            overflow: hidden;
            touch-action: none;
        }
        
        #game-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        #score-board {
            background: rgba(255, 255, 255, 0.9);
            padding: 15px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            color: #2C3E50;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        #instruction {
            font-size: 28px;
            color: #E74C3C;
            margin-top: 10px;
            text-shadow: 2px 2px 4px rgba(255,255,255,0.8);
        }
        
        #play-area {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
        }
        
        .zone {
            width: 400px;
            height: 450px;
            position: relative;
            border-radius: 20px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            padding: 60px 20px 20px 20px;
        }
        
        .zone.highlight {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(255, 215, 0, 0.8);
        }
        
        .drop-area {
            border: 4px dashed rgba(255,255,255,0.5);
            border-radius: 15px;
            position: relative;
            background: rgba(255,255,255,0.2);
            transition: all 0.3s;
        }
        
        .drop-area.highlight-direction {
            border-color: #FFD700;
            background: rgba(255, 215, 0, 0.3);
            border-width: 6px;
        }
        
        .drop-area.left {
            grid-column: 1;
        }
        
        .drop-area.right {
            grid-column: 2;
        }
        
        .direction-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            opacity: 0.6;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #inside-zone {
            background: linear-gradient(135deg, #FFA07A 0%, #FF7F50 100%);
            border: 8px solid #8B4513;
        }
        
        #outside-zone {
            background: linear-gradient(135deg, #98FB98 0%, #90EE90 100%);
            border: 8px solid #228B22;
        }
        
        .zone-label {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.9);
            padding: 10px 20px;
            border-radius: 15px;
            font-size: 32px;
            font-weight: bold;
            color: #2C3E50;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .house {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 200px;
            height: 150px;
            pointer-events: none;
        }
        
        .house-roof {
            width: 0;
            height: 0;
            border-left: 110px solid transparent;
            border-right: 110px solid transparent;
            border-bottom: 80px solid #8B4513;
            position: absolute;
            top: -60px;
            left: -10px;
        }
        
        .house-body {
            width: 200px;
            height: 130px;
            background: #D2691E;
            border-radius: 10px;
            position: relative;
        }
        
        .house-door {
            width: 45px;
            height: 75px;
            background: #654321;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            border-radius: 8px 8px 0 0;
        }
        
        .house-window {
            width: 35px;
            height: 35px;
            background: #87CEEB;
            position: absolute;
            top: 20px;
            border: 2px solid #654321;
            border-radius: 4px;
        }
        
        .house-window:first-of-type {
            left: 20px;
        }
        
        .house-window:last-of-type {
            right: 20px;
        }
        
        .garden {
            position: absolute;
            bottom: 60px;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 250px;
            pointer-events: none;
        }
        
        .tree {
            position: absolute;
            bottom: 40px;
        }
        
        .tree-trunk {
            width: 25px;
            height: 50px;
            background: #8B4513;
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .tree-leaves {
            width: 80px;
            height: 80px;
            background: #228B22;
            border-radius: 50%;
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
        }
        
        .tree:first-of-type {
            left: 15px;
        }
        
        .tree:last-of-type {
            right: 15px;
        }
        
        .flower {
            position: absolute;
            bottom: 15px;
            width: 25px;
            height: 25px;
            background: #FF69B4;
            border-radius: 50%;
        }
        
        .flower:nth-child(3) { left: 65px; }
        .flower:nth-child(4) { left: 110px; }
        .flower:nth-child(5) { right: 65px; }
        
        #animals-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 30px;
        }
        
        .animal {
            width: 80px;
            height: 80px;
            cursor: grab;
            font-size: 60px;
            text-align: center;
            line-height: 80px;
            background: white;
            border-radius: 50%;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            transition: transform 0.2s;
            user-select: none;
            position: relative;
        }
        
        .animal:hover {
            transform: scale(1.1);
        }
        
        .animal.dragging {
            cursor: grabbing;
            opacity: 0.7;
            transform: scale(1.2);
            z-index: 1000;
        }
        
        .animal.correct {
            animation: bounce 0.5s;
        }
        
        @keyframes bounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.3); }
        }
        
        #feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
            font-weight: bold;
            color: #FFD700;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.5);
            display: none;
            z-index: 2000;
            animation: feedbackPop 1s;
        }
        
        @keyframes feedbackPop {
            0% { transform: translate(-50%, -50%) scale(0); }
            50% { transform: translate(-50%, -50%) scale(1.2); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }
        
        #next-button {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 15px 30px;
            font-size: 24px;
            font-weight: bold;
            background: #4CAF50;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            display: none;
        }
        
        #next-button:hover {
            background: #45a049;
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="score-board">
            <div>⭐ Точки: <span id="score">0</span></div>
            <div id="instruction">Плъзни животното на правилното място!</div>
        </div>
        
        <div id="play-area">
            <div id="inside-zone" class="zone">
                <div class="zone-label">ВЪТРЕ 🏠</div>
                <div class="drop-area left" data-zone="inside" data-direction="left">
                    <div class="direction-label">⬅️</div>
                </div>
                <div class="drop-area right" data-zone="inside" data-direction="right">
                    <div class="direction-label">➡️</div>
                </div>
                <div class="house">
                    <div class="house-roof"></div>
                    <div class="house-body">
                        <div class="house-window"></div>
                        <div class="house-window"></div>
                        <div class="house-door"></div>
                    </div>
                </div>
            </div>
            
            <div id="outside-zone" class="zone">
                <div class="zone-label">ВЪН 🌳</div>
                <div class="drop-area left" data-zone="outside" data-direction="left">
                    <div class="direction-label">⬅️</div>
                </div>
                <div class="drop-area right" data-zone="outside" data-direction="right">
                    <div class="direction-label">➡️</div>
                </div>
                <div class="garden">
                    <div class="tree">
                        <div class="tree-leaves"></div>
                        <div class="tree-trunk"></div>
                    </div>
                    <div class="tree">
                        <div class="tree-leaves"></div>
                        <div class="tree-trunk"></div>
                    </div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                    <div class="flower"></div>
                </div>
            </div>
        </div>
        
        <div id="animals-container">
            <div class="animal" draggable="true" data-animal="rabbit">🐰</div>
            <div class="animal" draggable="true" data-animal="cat">🐱</div>
            <div class="animal" draggable="true" data-animal="bird">🐦</div>
        </div>
    </div>
    
    <div id="feedback"></div>
    <button id="next-button">Следваща задача ➡️</button>

    <script>
        const tasks = [
            // Ниво 1: Основни понятия ВЪТРЕ-ВЪН
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'inside', text: 'Сложи ЗАЙЧЕТО ВЪТРЕ в къщата', level: 1 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'outside', text: 'Сложи КОТКАТА ВЪН в градината', level: 1 },
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'outside', text: 'Сложи ПТИЧКАТА ВЪН в градината', level: 1 },
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'outside', text: 'Сложи ЗАЙЧЕТО ВЪН в градината', level: 1 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'inside', text: 'Сложи КОТКАТА ВЪТРЕ в къщата', level: 1 },
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'inside', text: 'Сложи ПТИЧКАТА ВЪТРЕ в къщата', level: 1 },
            
            // Ниво 2: ВЪТРЕ-ВЪН + НАЛЯВО
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'inside', direction: 'left', text: 'Сложи ЗАЙЧЕТО ВЪТРЕ в къщата НАЛЯВО', level: 2 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'outside', direction: 'left', text: 'Сложи КОТКАТА ВЪН в градината НАЛЯВО', level: 2 },
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'inside', direction: 'left', text: 'Сложи ПТИЧКАТА ВЪТРЕ в къщата НАЛЯВО', level: 2 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'inside', direction: 'left', text: 'Сложи КОТКАТА ВЪТРЕ в къщата НАЛЯВО', level: 2 },
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'outside', direction: 'left', text: 'Сложи ЗАЙЧЕТО ВЪН в градината НАЛЯВО', level: 2 },
            
            // Ниво 3: ВЪТРЕ-ВЪН + НАДЯСНО
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'outside', direction: 'right', text: 'Сложи ПТИЧКАТА ВЪН в градината НАДЯСНО', level: 3 },
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'inside', direction: 'right', text: 'Сложи ЗАЙЧЕТО ВЪТРЕ в къщата НАДЯСНО', level: 3 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'outside', direction: 'right', text: 'Сложи КОТКАТА ВЪН в градината НАДЯСНО', level: 3 },
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'inside', direction: 'right', text: 'Сложи ПТИЧКАТА ВЪТРЕ в къщата НАДЯСНО', level: 3 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'inside', direction: 'right', text: 'Сложи КОТКАТА ВЪТРЕ в къщата НАДЯСНО', level: 3 },
            
            // Ниво 4: Микс НАЛЯВО и НАДЯСНО
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'outside', direction: 'right', text: 'Сложи ЗАЙЧЕТО ВЪН в градината НАДЯСНО', level: 4 },
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'inside', direction: 'left', text: 'Сложи ПТИЧКАТА ВЪТРЕ в къщата НАЛЯВО', level: 4 },
            { animal: 'cat', emoji: '🐱', name: 'котката', zone: 'outside', direction: 'left', text: 'Сложи КОТКАТА ВЪН в градината НАЛЯВО', level: 4 },
            { animal: 'rabbit', emoji: '🐰', name: 'зайчето', zone: 'inside', direction: 'right', text: 'Сложи ЗАЙЧЕТО ВЪТРЕ в къщата НАДЯСНО', level: 4 },
            { animal: 'bird', emoji: '🐦', name: 'птичката', zone: 'outside', direction: 'right', text: 'Сложи ПТИЧКАТА ВЪН в градината НАДЯСНО', level: 4 }
        ];
        
        let currentTaskIndex = 0;
        let score = 0;
        let draggedAnimal = null;
        
        const instructionEl = document.getElementById('instruction');
        const scoreEl = document.getElementById('score');
        const feedbackEl = document.getElementById('feedback');
        const nextButton = document.getElementById('next-button');
        const insideZone = document.getElementById('inside-zone');
        const outsideZone = document.getElementById('outside-zone');
        const animals = document.querySelectorAll('.animal');
        const dropAreas = document.querySelectorAll('.drop-area');
        
        function loadTask() {
            const task = tasks[currentTaskIndex];
            instructionEl.textContent = task.text;
            nextButton.style.display = 'none';
            
            // Reset animals
            animals.forEach(animal => {
                animal.classList.remove('correct');
                animal.style.position = 'relative';
                animal.style.left = '0';
                animal.style.top = '0';
            });
            
            // Reset zones
            insideZone.classList.remove('highlight');
            outsideZone.classList.remove('highlight');
            dropAreas.forEach(area => area.classList.remove('highlight-direction'));
            
            // Highlight correct zone
            if (task.zone === 'inside') {
                insideZone.classList.add('highlight');
            } else {
                outsideZone.classList.add('highlight');
            }
            
            // Highlight direction if task has direction
            if (task.direction) {
                dropAreas.forEach(area => {
                    if (area.dataset.zone === task.zone && area.dataset.direction === task.direction) {
                        area.classList.add('highlight-direction');
                    }
                });
            }
        }
        
        function showFeedback(correct) {
            feedbackEl.textContent = correct ? '🎉 БРАВО!' : '😊 Опитай пак!';
            feedbackEl.style.display = 'block';
            feedbackEl.style.color = correct ? '#FFD700' : '#FF6B6B';
            
            setTimeout(() => {
                feedbackEl.style.display = 'none';
            }, 1500);
        }
        
        function checkAnswer(animal, zone, direction) {
            const task = tasks[currentTaskIndex];
            const animalType = animal.dataset.animal;
            
            let isCorrect = animalType === task.animal && zone === task.zone;
            
            // Check direction if task requires it
            if (task.direction) {
                isCorrect = isCorrect && direction === task.direction;
            }
            
            if (isCorrect) {
                score += 10;
                scoreEl.textContent = score;
                animal.classList.add('correct');
                showFeedback(true);
                
                setTimeout(() => {
                    currentTaskIndex++;
                    if (currentTaskIndex < tasks.length) {
                        nextButton.style.display = 'block';
                    } else {
                        instructionEl.textContent = '🎊 БРАВО! Завърши всички задачи! 🎊';
                        insideZone.classList.remove('highlight');
                        outsideZone.classList.remove('highlight');
                        dropAreas.forEach(area => area.classList.remove('highlight-direction'));
                    }
                }, 1000);
            } else {
                showFeedback(false);
            }
        }
        
        // Touch and mouse drag events
        let startX, startY;
        
        animals.forEach(animal => {
            // Mouse events
            animal.addEventListener('mousedown', (e) => {
                draggedAnimal = animal;
                animal.classList.add('dragging');
                startX = e.clientX - animal.offsetLeft;
                startY = e.clientY - animal.offsetTop;
                animal.style.position = 'fixed';
            });
            
            // Touch events
            animal.addEventListener('touchstart', (e) => {
                draggedAnimal = animal;
                animal.classList.add('dragging');
                const touch = e.touches[0];
                startX = touch.clientX - animal.offsetLeft;
                startY = touch.clientY - animal.offsetTop;
                animal.style.position = 'fixed';
                e.preventDefault();
            });
        });
        
        document.addEventListener('mousemove', (e) => {
            if (draggedAnimal) {
                draggedAnimal.style.left = (e.clientX - startX) + 'px';
                draggedAnimal.style.top = (e.clientY - startY) + 'px';
            }
        });
        
        document.addEventListener('touchmove', (e) => {
            if (draggedAnimal) {
                const touch = e.touches[0];
                draggedAnimal.style.left = (touch.clientX - startX) + 'px';
                draggedAnimal.style.top = (touch.clientY - startY) + 'px';
                e.preventDefault();
            }
        });
        
        document.addEventListener('mouseup', (e) => {
            if (draggedAnimal) {
                const rect = draggedAnimal.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let zone = null;
                let direction = null;
                
                // Check which drop area the animal is over
                dropAreas.forEach(area => {
                    const areaRect = area.getBoundingClientRect();
                    if (centerX >= areaRect.left && centerX <= areaRect.right &&
                        centerY >= areaRect.top && centerY <= areaRect.bottom) {
                        zone = area.dataset.zone;
                        direction = area.dataset.direction;
                    }
                });
                
                if (zone) {
                    checkAnswer(draggedAnimal, zone, direction);
                }
                
                draggedAnimal.classList.remove('dragging');
                draggedAnimal = null;
            }
        });
        
        document.addEventListener('touchend', (e) => {
            if (draggedAnimal) {
                const rect = draggedAnimal.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                
                let zone = null;
                let direction = null;
                
                // Check which drop area the animal is over
                dropAreas.forEach(area => {
                    const areaRect = area.getBoundingClientRect();
                    if (centerX >= areaRect.left && centerX <= areaRect.right &&
                        centerY >= areaRect.top && centerY <= areaRect.bottom) {
                        zone = area.dataset.zone;
                        direction = area.dataset.direction;
                    }
                });
                
                if (zone) {
                    checkAnswer(draggedAnimal, zone, direction);
                }
                
                draggedAnimal.classList.remove('dragging');
                draggedAnimal = null;
            }
        });
        
        nextButton.addEventListener('click', loadTask);
        
        // Start game
        loadTask();
    </script>
</body>
</html>
