<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <title>Великденски Логически Пъзел</title>
    <style>
        body { font-family: 'Arial', sans-serif; background: #fffde7; text-align: center; margin: 0; padding: 20px; }
        #game-container { background: white; border: 10px solid #fbc02d; border-radius: 40px; padding: 20px; display: inline-block; width: 95%; max-width: 800px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { color: #f57f17; margin-bottom: 5px; }
        #level-info { font-size: 22px; font-weight: bold; color: #afb42b; margin-bottom: 15px; }
        .pattern-area { background: #fff9c4; border: 4px dashed #fbc02d; border-radius: 20px; padding: 30px; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; min-height: 120px; }
        /* ТОВА СА ЯЙЦАТА */
        .egg { width: 60px; height: 85px; border-radius: 50% 50% 50% 50% / 65% 65% 35% 35%; display: inline-block; margin: 10px; border: 3px solid rgba(0,0,0,0.15); box-shadow: 3px 3px 5px rgba(0,0,0,0.1); }
        .question-mark { font-size: 50px; font-weight: bold; color: #f57f17; margin-left: 10px; }
        .options-area { display: flex; justify-content: center; gap: 20px; margin-top: 10px; padding: 15px; background: #f1f8e9; border-radius: 20px; }
        .option-egg { cursor: pointer; transition: 0.2s; }
        .option-egg:hover { transform: scale(1.2); }
        #message { font-size: 26px; margin-top: 20px; min-height: 35px; font-weight: bold; color: #333; }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🧩 Кое следва? 🧩</h1>
    <div id="level-info">Ниво: 1</div>
    <div class="pattern-area" id="pattern"></div>
    <div id="message">Погледни редицата и избери следващото яйце!</div>
    <div class="options-area" id="options"></div>
</div>

<script>
    let level = 1;
    let correctAnswer = "";
    // Използваме твърди цветове, за да сме сигурни, че се виждат
    const colorPalette = ["#FF5252", "#448AFF", "#4CAF50", "#FFEB3B", "#9C27B0", "#FF9800"];
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    function playSound(freq, type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type || 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }

    function initLevel() {
        const patternDiv = document.getElementById('pattern');
        const optionsDiv = document.getElementById('options');
        document.getElementById('level-info').innerText = "Ниво: " + level;
        patternDiv.innerHTML = "";
        optionsDiv.innerHTML = "";

        // Избираме два случайни цвята
        let c1 = colorPalette[Math.floor(Math.random() * 3)];
        let c2 = colorPalette[Math.floor(Math.random() * 3) + 3];

        let sequence = [];
        if (level % 2 !== 0) {
            sequence = [c1, c2, c1, c2]; // Модел А-Б-А-Б
            correctAnswer = c1;
        } else {
            sequence = [c1, c1, c2, c1, c1]; // Модел А-А-Б-А-А
            correctAnswer = c2;
        }

        // Показваме редицата
        sequence.forEach(color => {
            const e = document.createElement('div');
            e.className = 'egg';
            e.style.backgroundColor = color;
            patternDiv.appendChild(e);
        });

        const q = document.createElement('span');
        q.className = 'question-mark';
        q.innerText = "?";
        patternDiv.appendChild(q);

        // Показваме опциите (винаги двата цвята, за да избират)
        [c1, c2].sort(() => Math.random() - 0.5).forEach(color => {
            const opt = document.createElement('div');
            opt.className = 'egg option-egg';
            opt.style.backgroundColor = color;
            opt.onclick = () => {
                if (color === correctAnswer) {
                    document.getElementById('message').innerText = "БРАВО! 🎉";
                    document.getElementById('message').style.color = "green";
                    playSound(600, 'sine');
                    level++;
                    setTimeout(initLevel, 1500);
                } else {
                    document.getElementById('message').innerText = "Опитай пак! 🧐";
                    document.getElementById('message').style.color = "red";
                    playSound(150, 'square');
                }
            };
            optionsDiv.appendChild(opt);
        });
    }

    initLevel();
</script>

</body>
</html>
